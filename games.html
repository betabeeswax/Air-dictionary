<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIR Dictionary — Mini Games</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--text:#e8eef7;--muted:#8b9bb4;--accent:#5b9fd4;--syn:#6bcf9a;--border:#2a3548}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:640px;margin:0 auto;padding:1.2rem}
.logo{text-align:center;margin-bottom:.8rem}
.logo .air{font-size:2rem;font-weight:800;color:#5b9fd4}
.logo .dict{font-size:1rem;font-weight:600;color:#e8eef7}
.modes{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:0.6rem 0 1rem}
.modes a{padding:.35rem .7rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);text-decoration:none;font-size:.82rem;font-weight:600}
.modes a.active{background:var(--accent);color:#041018;border-color:var(--accent)}
h1{font-size:1.2rem;text-align:center;margin:0 0 1rem;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
.gbtn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;text-align:left;color:var(--text)}
.gbtn:hover{border-color:var(--accent)}
.gbtn .ico{font-size:1.5rem}
.gbtn .name{font-weight:700;margin-top:.3rem}
.gbtn .desc{font-size:.78rem;color:var(--muted);margin-top:.2rem}
#play{display:none;margin-top:1rem}
#playBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
#playBar button{padding:.4rem .8rem;border:0;border-radius:8px;background:var(--border);color:var(--text);cursor:pointer;font-weight:600}
#playTitle{font-weight:700;color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center}
canvas{background:#0a0e14;border-radius:8px;display:block;margin:0 auto;max-width:100%}
.row{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.row button{padding:.45rem .75rem;border:0;border-radius:8px;background:var(--accent);color:#041018;font-weight:700;cursor:pointer}
.score{color:var(--muted);font-size:.9rem;margin-top:.4rem}
.msg{margin-top:.5rem;font-size:.95rem}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;max-width:280px;margin:0 auto}
.mem button{aspect-ratio:1;border:0;border-radius:8px;background:#243044;color:var(--text);font-size:1.3rem;cursor:pointer}
.mem button.open,.mem button.done{background:#1a2332}
.mem button.done{opacity:.7}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;max-width:210px;margin:0 auto}
.ttt button{aspect-ratio:1;border:0;border-radius:8px;background:#243044;color:var(--text);font-size:1.6rem;font-weight:800;cursor:pointer}
input[type=number],input[type=text]{padding:.5rem;border-radius:8px;border:1px solid var(--border);background:#121a24;color:var(--text);width:120px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:2rem}
footer a{color:var(--accent)}
</style></head><body>
<div class="wrap">
  <div class="logo">
    <div class="air">ΛIR</div>
    <div class="dict">Dictionary</div>
  </div>
  <div class="modes">
    <a href="index.html">Lite</a>
    <a href="full.html">Full</a>
    <a href="google.html">Google It</a>
    <a href="games.html" class="active">Games</a>
  </div>
  <h1>Mini Games</h1>
  <div class="grid" id="menu">
    <button class="gbtn" data-game="snake"><div class="ico">🐍</div><div class="name">Snake</div><div class="desc">Eat food, don't hit walls</div></button>
    <button class="gbtn" data-game="memory"><div class="ico">🧠</div><div class="name">Memory</div><div class="desc">Match the pairs</div></button>
    <button class="gbtn" data-game="ttt"><div class="ico">⭕</div><div class="name">Tic Tac Toe</div><div class="desc">You vs computer</div></button>
    <button class="gbtn" data-game="rps"><div class="ico">✊</div><div class="name">Rock Paper Scissors</div><div class="desc">Best of luck</div></button>
    <button class="gbtn" data-game="guess"><div class="ico">🔢</div><div class="name">Number Guess</div><div class="desc">1 to 50</div></button>
    <button class="gbtn" data-game="react"><div class="ico">⚡</div><div class="name">Reaction</div><div class="desc">Click when it turns green</div></button>
    <button class="gbtn" data-game="whack"><div class="ico">🔨</div><div class="name">Whack-a-Mole</div><div class="desc">Tap the moles</div></button>
    <button class="gbtn" data-game="clicker"><div class="ico">👆</div><div class="name">Speed Click</div><div class="desc">10 seconds, max clicks</div></button>
    <button class="gbtn" data-game="color"><div class="ico">🎨</div><div class="name">Color Match</div><div class="desc">Pick the right color name</div></button>
    <button class="gbtn" data-game="type"><div class="ico">⌨️</div><div class="name">Type Race</div><div class="desc">Type the word fast</div></button>
  </div>
  <div id="play">
    <div id="playBar"><span id="playTitle"></span><button type="button" id="backBtn">← Games</button></div>
    <div class="panel" id="panel"></div>
  </div>
  <footer><a href="index.html">Back to Lite Dictionary</a></footer>
</div>
<script>
const menu=document.getElementById('menu'), play=document.getElementById('play'), panel=document.getElementById('panel'), playTitle=document.getElementById('playTitle');
let timer=null, anim=null;
function clearTimers(){ if(timer) clearInterval(timer); if(anim) cancelAnimationFrame(anim); timer=null; anim=null; }
document.getElementById('backBtn').onclick=()=>{ clearTimers(); play.style.display='none'; menu.style.display='grid'; };

document.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>{
  clearTimers();
  menu.style.display='none';
  play.style.display='block';
  const g=b.dataset.game;
  playTitle.textContent=b.querySelector('.name').textContent;
  ({snake,memory,ttt,rps,guess,react,whack,clicker,color,type})[g]();
});

function snake(){
  panel.innerHTML='<canvas id="c" width="320" height="256"></canvas><div class="score" id="sc">Score: 0</div><div class="row"><button data-d="u">↑</button><button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button><button id="rs">Restart</button></div>';
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), S=16, C=20, R=16;
  let snake=[{x:10,y:8}], dir={x:1,y:0}, food={x:15,y:8}, score=0, alive=true;
  function place(){ food={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)}; if(snake.some(s=>s.x===food.x&&s.y===food.y)) place(); }
  function draw(){
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,320,256);
    ctx.fillStyle='#6bcf9a'; snake.forEach(s=>ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2));
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(food.x*S+1,food.y*S+1,S-2,S-2);
    document.getElementById('sc').textContent='Score: '+score+(alive?'':' — Game over');
  }
  function step(){
    if(!alive) return;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=C||h.y>=R||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;draw();return;}
    snake.unshift(h); if(h.x===food.x&&h.y===food.y){score++;place();} else snake.pop(); draw();
  }
  function setDir(dx,dy){ if(dx&&!dir.x) dir={x:dx,y:0}; if(dy&&!dir.y) dir={x:0,y:dy}; }
  window._sk=e=>{ if(e.key==='ArrowUp'){dir.y===0&&(dir={x:0,y:-1});e.preventDefault();} if(e.key==='ArrowDown'){dir.y===0&&(dir={x:0,y:1});e.preventDefault();} if(e.key==='ArrowLeft'){dir.x===0&&(dir={x:-1,y:0});e.preventDefault();} if(e.key==='ArrowRight'){dir.x===0&&(dir={x:1,y:0});e.preventDefault();} };
  window.addEventListener('keydown',window._sk);
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d; if(d==='u') setDir(0,-1); if(d==='d') setDir(0,1); if(d==='l') setDir(-1,0); if(d==='r') setDir(1,0);});
  document.getElementById('rs').onclick=()=>{snake=[{x:10,y:8}];dir={x:1,y:0};score=0;alive=true;place();draw();};
  place(); draw(); timer=setInterval(step,120);
}

function memory(){
  const icons=['🍎','⭐','🌙','🔥','💎','🎵','🚀','🌈'];
  let cards=[...icons,...icons].sort(()=>Math.random()-0.5);
  let open=[], locked=false, matched=0;
  panel.innerHTML='<div class="mem" id="mem"></div><div class="score" id="sc">Matches: 0 / 8</div>';
  const mem=document.getElementById('mem');
  cards.forEach((ico,i)=>{
    const b=document.createElement('button'); b.textContent='❓'; b.dataset.i=i;
    b.onclick=()=>{
      if(locked||b.classList.contains('open')||b.classList.contains('done')) return;
      b.textContent=ico; b.classList.add('open'); open.push(b);
      if(open.length===2){
        locked=true;
        const [a,b2]=open;
        if(cards[+a.dataset.i]===cards[+b2.dataset.i]){
          a.classList.add('done'); b2.classList.add('done'); matched++; open=[]; locked=false;
          document.getElementById('sc').textContent='Matches: '+matched+' / 8'+(matched===8?' — You win!':'');
        } else {
          setTimeout(()=>{a.textContent='❓';b2.textContent='❓';a.classList.remove('open');b2.classList.remove('open');open=[];locked=false;},500);
        }
      }
    };
    mem.appendChild(b);
  });
}

function ttt(){
  let board=Array(9).fill(''), turn='X', over=false;
  panel.innerHTML='<div class="ttt" id="ttt"></div><div class="msg" id="msg">Your turn (X)</div><div class="row"><button id="rs">Restart</button></div>';
  const box=document.getElementById('ttt'), msg=document.getElementById('msg');
  function wins(p){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return L.some(l=>l.every(i=>board[i]===p));}
  function render(){
    box.innerHTML='';
    board.forEach((v,i)=>{
      const b=document.createElement('button'); b.textContent=v||'';
      b.onclick=()=>{
        if(over||board[i]||turn!=='X') return;
        board[i]='X';
        if(wins('X')){over=true;msg.textContent='You win!';render();return;}
        if(board.every(x=>x)){over=true;msg.textContent='Draw!';render();return;}
        turn='O'; msg.textContent='Computer...';
        render();
        setTimeout(()=>{
          const empty=board.map((x,i)=>x?'':i).filter(x=>x!=='');
          if(!empty.length) return;
          let move=null;
          for(const i of empty){board[i]='O'; if(wins('O')){move=i;} board[i]=''; if(move!==null) break;}
          if(move===null) for(const i of empty){board[i]='X'; if(wins('X')){move=i;} board[i]=''; if(move!==null) break;}
          if(move===null) move=empty[Math.floor(Math.random()*empty.length)];
          board[move]='O';
          if(wins('O')){over=true;msg.textContent='Computer wins!';}
          else if(board.every(x=>x)){over=true;msg.textContent='Draw!';}
          else {turn='X'; msg.textContent='Your turn (X)';}
          render();
        }, 350);
      };
      box.appendChild(b);
    });
  }
  document.getElementById('rs').onclick=()=>{board=Array(9).fill('');turn='X';over=false;msg.textContent='Your turn (X)';render();};
  render();
}

function rps(){
  let u=0,c=0;
  panel.innerHTML='<div class="msg" id="msg">Pick one!</div><div class="row"><button data-m="rock">✊ Rock</button><button data-m="paper">✋ Paper</button><button data-m="scissors">✌ Scissors</button></div><div class="score" id="sc">You 0 — 0 CPU</div>';
  const msg=document.getElementById('msg'), sc=document.getElementById('sc');
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const you=b.dataset.m, opts=['rock','paper','scissors'], cpu=opts[Math.floor(Math.random()*3)];
    let res='Draw';
    if(you===cpu) res='Draw!';
    else if((you==='rock'&&cpu==='scissors')||(you==='paper'&&cpu==='rock')||(you==='scissors'&&cpu==='paper')){res='You win!';u++;}
    else {res='CPU wins!';c++;}
    msg.textContent='You: '+you+' · CPU: '+cpu+' · '+res;
    sc.textContent='You '+u+' — '+c+' CPU';
  });
}

function guess(){
  let n=Math.floor(Math.random()*50)+1, tries=0;
  panel.innerHTML='<div class="msg">Guess a number 1–50</div><input type="number" id="g" min="1" max="50"><div class="row"><button id="go">Guess</button><button id="rs">New</button></div><div class="msg" id="msg"></div>';
  const msg=document.getElementById('msg');
  document.getElementById('go').onclick=()=>{
    const val=+document.getElementById('g').value; tries++;
    if(val===n) msg.textContent='Correct in '+tries+' tries!';
    else if(val<n) msg.textContent='Too low';
    else msg.textContent='Too high';
  };
  document.getElementById('rs').onclick=()=>{n=Math.floor(Math.random()*50)+1;tries=0;msg.textContent='';document.getElementById('g').value='';};
}

function react(){
  panel.innerHTML='<div id="box" style="height:140px;border-radius:12px;background:#243044;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700">Wait for green...</div><div class="score" id="sc"></div><div class="row"><button id="rs">Try again</button></div>';
  const box=document.getElementById('box'), sc=document.getElementById('sc');
  let t0=0, ready=false, waiting=false;
  function arm(){
    box.style.background='#243044'; box.textContent='Wait for green...'; ready=false; waiting=true; sc.textContent='';
    const delay=1000+Math.random()*2000;
    timer=setTimeout(()=>{ box.style.background='#6bcf9a'; box.textContent='CLICK!'; ready=true; t0=performance.now(); }, delay);
  }
  box.onclick=()=>{
    if(waiting && !ready){ clearTimeout(timer); box.textContent='Too soon!'; waiting=false; return; }
    if(ready){ const ms=Math.round(performance.now()-t0); sc.textContent='Reaction: '+ms+' ms'; ready=false; waiting=false; box.textContent='Nice!'; }
  };
  document.getElementById('rs').onclick=arm; arm();
}

function whack(){
  panel.innerHTML='<div id="holes" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:240px;margin:0 auto"></div><div class="score" id="sc">Score: 0 · Time: 20</div>';
  const holes=document.getElementById('holes'), sc=document.getElementById('sc');
  let score=0, time=20, active=-1;
  for(let i=0;i<9;i++){ const b=document.createElement('button'); b.style.cssText='aspect-ratio:1;border:0;border-radius:50%;background:#243044;font-size:1.5rem;cursor:pointer'; b.textContent=''; b.onclick=()=>{ if(i===active){ score++; active=-1; b.textContent=''; sc.textContent='Score: '+score+' · Time: '+time; } }; holes.appendChild(b); }
  const btns=[...holes.children];
  timer=setInterval(()=>{
    time--; sc.textContent='Score: '+score+' · Time: '+time;
    if(active>=0) btns[active].textContent='';
    active=Math.floor(Math.random()*9); btns[active].textContent='🐹';
    if(time<=0){ clearInterval(timer); btns.forEach(b=>b.textContent=''); sc.textContent='Final score: '+score; }
  }, 1000);
}

function clicker(){
  panel.innerHTML='<div class="msg">Click as fast as you can!</div><div class="row"><button id="clk" style="font-size:1.2rem;padding:1rem 2rem">CLICK</button></div><div class="score" id="sc">Clicks: 0 · Time: 10</div><div class="row"><button id="rs">Start</button></div>';
  let clicks=0, time=10, running=false;
  const sc=document.getElementById('sc');
  document.getElementById('clk').onclick=()=>{ if(running){ clicks++; sc.textContent='Clicks: '+clicks+' · Time: '+time; } };
  document.getElementById('rs').onclick=()=>{
    clearInterval(timer); clicks=0; time=10; running=true; sc.textContent='Clicks: 0 · Time: 10';
    timer=setInterval(()=>{ time--; sc.textContent='Clicks: '+clicks+' · Time: '+time; if(time<=0){ clearInterval(timer); running=false; sc.textContent='Done! '+clicks+' clicks'; } },1000);
  };
}

function color(){
  const colors=[{n:'Red',c:'#e88a8a'},{n:'Blue',c:'#5b9fd4'},{n:'Green',c:'#6bcf9a'},{n:'Yellow',c:'#e8d44d'},{n:'Purple',c:'#b48ce8'},{n:'Orange',c:'#e8a04a'}];
  let score=0, round=0;
  function next(){
    if(round>=8){ panel.innerHTML='<div class="msg">Score: '+score+'/8</div><div class="row"><button id="rs">Play again</button></div>'; document.getElementById('rs').onclick=()=>{score=0;round=0;next();}; return; }
    round++;
    const target=colors[Math.floor(Math.random()*colors.length)];
    const opts=[...colors].sort(()=>Math.random()-0.5).slice(0,4);
    if(!opts.find(o=>o.n===target.n)) opts[0]=target;
    opts.sort(()=>Math.random()-0.5);
    panel.innerHTML='<div class="msg">What color is this?</div><div style="width:80px;height:80px;border-radius:12px;background:'+target.c+';margin:0.6rem auto"></div><div class="row" id="opts"></div><div class="score">Round '+round+'/8 · Score '+score+'</div>';
    opts.forEach(o=>{
      const b=document.createElement('button'); b.textContent=o.n;
      b.onclick=()=>{ if(o.n===target.n) score++; next(); };
      document.getElementById('opts').appendChild(b);
    });
  }
  next();
}

function type(){
  const words=['dictionary','computer','adventure','science','pyramid','galaxy','thunder','crystal','voyage','puzzle'];
  let word='', t0=0;
  function newWord(){ word=words[Math.floor(Math.random()*words.length)]; t0=performance.now();
    panel.innerHTML='<div class="msg">Type this word:</div><div style="font-size:1.4rem;font-weight:800;color:var(--accent);margin:.5rem 0">'+word+'</div><input type="text" id="tw" autocomplete="off" style="width:90%"><div class="msg" id="msg"></div><div class="row"><button id="nw">New word</button></div>';
    const inp=document.getElementById('tw'); inp.focus();
    inp.oninput=()=>{ if(inp.value.toLowerCase()===word){ const ms=Math.round(performance.now()-t0); document.getElementById('msg').textContent='Done in '+(ms/1000).toFixed(2)+'s!'; } };
    document.getElementById('nw').onclick=newWord;
  }
  newWord();
}
</script></body></html>
