<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIR Mini Games</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--text:#e8eef7;--muted:#8b9bb4;--accent:#5b9fd4;--ok:#6bcf9a;--border:#2a3548}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:1rem}
.logo{text-align:center;margin-bottom:.4rem}.logo .air{font-size:1.8rem;font-weight:800;color:var(--accent)}.logo .dict{font-size:.95rem;color:#e8eef7}
.modes{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin:.5rem 0}.modes a{padding:.3rem .65rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);text-decoration:none;font-size:.8rem;font-weight:600}.modes a.active{background:var(--accent);color:#041018}
.diff{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin:.4rem 0 .8rem}
.diff button{padding:.3rem .55rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.75rem;font-weight:700;cursor:pointer}
.diff button.on{background:var(--accent);color:#041018;border-color:var(--accent)}
h1{font-size:1.05rem;text-align:center;margin:0 0 .6rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
@media(min-width:540px){.grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.gbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem;cursor:pointer;text-align:left;color:var(--text)}.gbtn:hover{border-color:var(--accent)}
.gbtn .ico{font-size:1.2rem}.gbtn .name{font-weight:700;font-size:.85rem;margin-top:.2rem}.gbtn .desc{font-size:.68rem;color:var(--muted)}
#play{display:none;margin-top:.6rem}
#playBar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem;gap:.5rem}
#playBar button{padding:.35rem .7rem;border:0;border-radius:8px;background:var(--border);color:var(--text);cursor:pointer;font-weight:600}
#playTitle{font-weight:700;color:var(--accent);font-size:.95rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-align:center}
canvas{background:#0a0e14;border-radius:8px;display:block;margin:0 auto;max-width:100%}
.row{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap;margin-top:.45rem}
.row button,.panel>button{padding:.4rem .7rem;border:0;border-radius:8px;background:var(--accent);color:#041018;font-weight:700;cursor:pointer;font-size:.85rem}
.score,.msg{color:var(--muted);font-size:.85rem;margin-top:.35rem}.msg{color:var(--text)}
.mem,.ttt{display:grid;gap:.3rem;margin:0 auto}
.mem{grid-template-columns:repeat(4,1fr);max-width:260px}
.ttt{grid-template-columns:repeat(3,1fr);max-width:190px}
.mem button,.ttt button{aspect-ratio:1;border:0;border-radius:8px;background:#243044;color:var(--text);font-size:1.15rem;cursor:pointer;font-weight:700}
input[type=number],input[type=text]{padding:.45rem;border-radius:8px;border:1px solid var(--border);background:#121a24;color:var(--text);width:120px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:1.2rem}footer a{color:var(--accent)}
</style></head><body>
<div class="wrap">
  <div class="logo"><div class="air">ΛIR</div><div class="dict">Mini Games</div></div>
  <div class="modes">
    <a href="index.html">Lite</a><a href="full.html">Full</a><a href="google.html">Google It</a><a href="games.html" class="active">Games</a>
  </div>
  <div class="diff" id="diff">
    <button data-d="easy" class="on">Easy</button>
    <button data-d="medium">Medium</button>
    <button data-d="hard">Hard</button>
    <button data-d="extreme">Extreme</button>
    <button data-d="impossible">Impossible</button>
  </div>
  <h1>50 Games</h1>
  <div class="grid" id="menu"></div>
  <div id="play"><div id="playBar"><span id="playTitle"></span><button type="button" id="backBtn">← Menu</button></div><div class="panel" id="panel"></div></div>
  <footer><a href="index.html">Back to Dictionary</a></footer>
</div>
<script>
const DIFF={easy:{spd:1,lives:5,time:30,grid:8,mult:1},medium:{spd:1.3,lives:3,time:20,grid:10,mult:1.2},hard:{spd:1.7,lives:2,time:15,grid:12,mult:1.5},extreme:{spd:2.2,lives:1,time:10,grid:14,mult:2},impossible:{spd:3,lives:1,time:7,grid:16,mult:3}};
let D=DIFF.easy, diffName='easy';
document.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#diff button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); diffName=b.dataset.d; D=DIFF[diffName];
});
const LIST=[
{id:'platform',ico:'🟩',n:'Platformer',d:'Jump & coins'},
{id:'snake',ico:'🐍',n:'Snake',d:'Grow the snake'},
{id:'memory',ico:'🧠',n:'Memory',d:'Match pairs'},
{id:'ttt',ico:'⭕',n:'Tic Tac Toe',d:'Vs computer'},
{id:'rps',ico:'✊',n:'RPS',d:'Rock paper scissors'},
{id:'guess',ico:'🔢',n:'Number Guess',d:'Guess the number'},
{id:'react',ico:'⚡',n:'Reaction',d:'Click on green'},
{id:'whack',ico:'🐹',n:'Whack-a-Mole',d:'Hit moles'},
{id:'clicker',ico:'👆',n:'Speed Click',d:'Click rush'},
{id:'color',ico:'🎨',n:'Color Match',d:'Name colors'},
{id:'type',ico:'⌨️',n:'Type Race',d:'Type fast'},
{id:'pong',ico:'🏓',n:'Pong',d:'Bounce ball'},
{id:'breakout',ico:'🧱',n:'Breakout',d:'Break bricks'},
{id:'flappy',ico:'🐤',n:'Flappy',d:'Tap to fly'},
{id:'dodge',ico:'☄️',n:'Dodge',d:'Avoid rocks'},
{id:'aim',ico:'🎯',n:'Target Aim',d:'Hit targets'},
{id:'math',ico:'➕',n:'Math Blitz',d:'Quick math'},
{id:'simon',ico:'🔔',n:'Simon',d:'Repeat pattern'},
{id:'maze',ico:'🌀',n:'Maze Run',d:'Reach the exit'},
{id:'slider',ico:'🧩',n:'Slide Puzzle',d:'3×3 puzzle'},
{id:'catch',ico:'🧺',n:'Catch',d:'Catch falling items'},
{id:'avoid',ico:'🚗',n:'Road Dodge',d:'Stay on road'},
{id:'tap',ico:'🔵',n:'Tap Circle',d:'Tap before gone'},
{id:'hold',ico:'⏱️',n:'Hold Steady',d:'Release on time'},
{id:'count',ico:'👀',n:'Quick Count',d:'Count dots'},
{id:'odd',ico:'🔍',n:'Find Odd',d:'Find the different one'},
{id:'seq',ico:'🔢',n:'Number Seq',d:'Next number'},
{id:'balloon',ico:'🎈',n:'Balloons',d:'Pop balloons'},
{id:'stack',ico:'📦',n:'Stack',d:'Stack blocks'},
{id:'bounce',ico:'⚽',n:'Keep Up',d:'Keep ball up'},
{id:'laser',ico:'📡',n:'Laser Grid',d:'Cross without hit'},
{id:'pixel',ico:'🟦',n:'Pixel Paint',d:'Fill the grid'},
{id:'runner',ico:'🏃',n:'Runner',d:'Jump obstacles'},
{id:'shoot',ico:'🚀',n:'Space Shot',d:'Shoot asteroids'},
{id:'match3',ico:'🍬',n:'Match Two',d:'Click matching pair'},
{id:'timer',ico:'⏰',n:'Exact Timer',d:'Stop on target'},
{id:'arrow',ico:'➡️',n:'Arrow Path',d:'Follow arrows'},
{id:'lights',ico:'💡',n:'Lights Out',d:'Turn all off'},
{id:'balance',ico:'⚖️',n:'Balance',d:'Keep centered'},
{id:'collect',ico:'⭐',n:'Star Collect',d:'Grab stars'},
{id:'walls',ico:'🧱',n:'Wall Jump',d:'Climb walls'},
{id:'orbit',ico:'🪐',n:'Orbit',d:'Circle safely'},
{id:'fuse',ico:'🧨',n:'Defuse',d:'Cut the wire'},
{id:'rhythm',ico:'🎵',n:'Rhythm Tap',d:'Tap on beat'},
{id:'shadow',ico:'👤',n:'Shadow Match',d:'Match shape'},
{id:'zoom',ico:'🔎',n:'Zoom Find',d:'Find the mark'},
{id:'gravity',ico:'⬇️',n:'Gravity Flip',d:'Flip & land'},
{id:'portal',ico:'🟣',n:'Portal Hop',d:'Reach portal'},
{id:'ice',ico:'🧊',n:'Ice Slide',d:'Slide to goal'},
{id:'boss',ico:'👾',n:'Boss Rush',d:'Survive waves'}
];
const menu=document.getElementById('menu'),play=document.getElementById('play'),panel=document.getElementById('panel'),playTitle=document.getElementById('playTitle');
let timer=null,raf=null;
function clearT(){if(timer)clearInterval(timer);if(raf)cancelAnimationFrame(raf);timer=raf=null;window.onkeydown=window.onkeyup=null;}
document.getElementById('backBtn').onclick=()=>{clearT();play.style.display='none';menu.style.display='grid';};
LIST.forEach(g=>{const b=document.createElement('button');b.className='gbtn';b.innerHTML=`<div class="ico">${g.ico}</div><div class="name">${g.n}</div><div class="desc">${g.d}</div>`;
b.onclick=()=>{clearT();menu.style.display='none';play.style.display='block';playTitle.textContent=g.n+' · '+diffName; (F[g.id]||F.snake)();};menu.appendChild(b);});
function cv(w=320,h=240){panel.innerHTML=`<canvas id="c" width="${w}" height="${h}"></canvas><div class="score" id="sc"></div><div class="row" id="ctrls"></div>`;return document.getElementById('c');}
function sc(t){const e=document.getElementById('sc');if(e)e.textContent=t;}
function msg(t){panel.innerHTML=`<div class="msg">${t}</div><div class="row"><button onclick="document.getElementById('backBtn').click()">Menu</button></div>`;}

const F={};
F.platform=()=>{
  const c=cv(360,240),ctx=c.getContext('2d'),g=0.4*D.spd;
  document.getElementById('ctrls').innerHTML='<span style="color:var(--muted);font-size:.75rem">←→ move · Space jump</span>';
  const plats=[{x:0,y:220,w:360,h:20},{x:30,y:165,w:70,h:12},{x:140,y:125,w:70,h:12},{x:250,y:85,w:70,h:12},{x:60,y:55,w:50,h:12}];
  let p={x:20,y:180,vx:0,vy:0,w:14,h:18,on:0},coins=[{x:55,y:145},{x:165,y:105},{x:275,y:65},{x:80,y:35}],got=0,keys={};
  window.onkeydown=e=>{keys[e.key]=1;if(['ArrowLeft','ArrowRight',' ','ArrowUp'].includes(e.key))e.preventDefault();};
  window.onkeyup=e=>{keys[e.key]=0;};
  (function loop(){p.vx=(keys.ArrowLeft||keys.a?-3:0)+(keys.ArrowRight||keys.d?3:0);if((keys[' ']||keys.ArrowUp||keys.w)&&p.on)p.vy=-7.5/Math.sqrt(D.spd);p.vy+=g;p.x+=p.vx;p.y+=p.vy;p.on=0;
  if(p.x<0)p.x=0;if(p.x>346)p.x=346;plats.forEach(pl=>{if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+16&&p.vy>=0){p.y=pl.y-p.h;p.vy=0;p.on=1;}});
  if(p.y>250){p.x=20;p.y=180;p.vy=0;}coins=coins.filter(co=>{if(Math.hypot(p.x+7-co.x,p.y+9-co.y)<14){got++;return false;}return true;});
  if(!coins.length){sc('YOU WIN! Coins '+got+' · '+diffName);return;}
  ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,360,240);ctx.fillStyle='#2a3548';plats.forEach(pl=>ctx.fillRect(pl.x,pl.y,pl.w,pl.h));
  ctx.fillStyle='#e8d44d';coins.forEach(co=>{ctx.beginPath();ctx.arc(co.x,co.y,6,0,7);ctx.fill();});ctx.fillStyle='#5b9fd4';ctx.fillRect(p.x,p.y,p.w,p.h);
  sc('Coins '+got+'/4 · '+diffName);raf=requestAnimationFrame(loop);})();
};

F.snake=()=>{
  const c=cv(320,256),ctx=c.getContext('2d'),S=16,C=20,R=16,spd=Math.max(50,140/D.spd);
  document.getElementById('ctrls').innerHTML='<button data-d="u">↑</button><button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button>';
  let sn=[{x:10,y:8}],dir={x:1,y:0},food={x:15,y:8},score=0,ok=1;
  const place=()=>{food={x:0|Math.random()*C,y:0|Math.random()*R};if(sn.some(s=>s.x===food.x&&s.y===food.y))place();};
  const draw=()=>{ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,320,256);ctx.fillStyle='#6bcf9a';sn.forEach(s=>ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2));ctx.fillStyle='#5b9fd4';ctx.fillRect(food.x*S+1,food.y*S+1,S-2,S-2);sc('Score '+score+(ok?'':' · GAME OVER')+' · '+diffName);};
  const step=()=>{if(!ok)return;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};if(h.x<0||h.y<0||h.x>=C||h.y>=R||sn.some(s=>s.x===h.x&&s.y===h.y)){ok=0;draw();return;}sn.unshift(h);if(h.x===food.x&&h.y===food.y){score++;place();}else sn.pop();draw();};
  window.onkeydown=e=>{if(e.key==='ArrowUp'&&!dir.y)dir={x:0,y:-1};if(e.key==='ArrowDown'&&!dir.y)dir={x:0,y:1};if(e.key==='ArrowLeft'&&!dir.x)dir={x:-1,y:0};if(e.key==='ArrowRight'&&!dir.x)dir={x:1,y:0};e.preventDefault();};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=b.dataset.d;if(d==='u'&&!dir.y)dir={x:0,y:-1};if(d==='d'&&!dir.y)dir={x:0,y:1};if(d==='l'&&!dir.x)dir={x:-1,y:0};if(d==='r'&&!dir.x)dir={x:1,y:0};});
  place();draw();timer=setInterval(step,spd);
};

F.maze=()=>{
  const N=D.grid, cell=Math.min(22,Math.floor(300/N)), size=N*cell;
  const c=cv(size,size),ctx=c.getContext('2d');
  const grid=Array.from({length:N},()=>Array(N).fill(1));
  function carve(x,y){grid[y][x]=0;[[0,-1],[1,0],[0,1],[-1,0]].sort(()=>Math.random()-0.5).forEach(([dx,dy])=>{const nx=x+dx*2,ny=y+dy*2;if(ny>=0&&ny<N&&nx>=0&&nx<N&&grid[ny][nx]===1){grid[y+dy][x+dx]=0;carve(nx,ny);}});}
  carve(0,0);grid[N-1][N-1]=0;grid[N-1][N-2]=0;grid[N-2][N-1]=0;
  let px=0,py=0,won=0;
  const draw=()=>{ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,size,size);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=grid[y][x]?'#2a3548':'#121a24';ctx.fillRect(x*cell,y*cell,cell-1,cell-1);}
    // EXIT clearly marked
    ctx.fillStyle='#6bcf9a';ctx.fillRect((N-1)*cell+3,(N-1)*cell+3,cell-6,cell-6);
    ctx.fillStyle='#041018';ctx.font=`bold ${Math.max(10,cell-8)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('END',(N-1)*cell+cell/2,(N-1)*cell+cell/2);
    ctx.fillStyle='#5b9fd4';ctx.fillRect(px*cell+4,py*cell+4,cell-8,cell-8);
    sc(won?'YOU REACHED THE END! 🎉 · '+diffName:'Arrow keys → green END · '+diffName);
  };
  window.onkeydown=e=>{if(won)return;let nx=px,ny=py;if(e.key==='ArrowLeft')nx--;if(e.key==='ArrowRight')nx++;if(e.key==='ArrowUp')ny--;if(e.key==='ArrowDown')ny++;
    if(nx>=0&&ny>=0&&nx<N&&ny<N&&!grid[ny][nx]){px=nx;py=ny;}e.preventDefault();
    if(px===N-1&&py===N-1){won=1;}draw();};
  document.getElementById('ctrls').innerHTML='<button id="u">↑</button><button id="l">←</button><button id="d">↓</button><button id="r">→</button>';
  const move=(dx,dy)=>{if(won)return;const nx=px+dx,ny=py+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!grid[ny][nx]){px=nx;py=ny;if(px===N-1&&py===N-1)won=1;draw();}};
  document.getElementById('u').onclick=()=>move(0,-1);document.getElementById('l').onclick=()=>move(-1,0);document.getElementById('d').onclick=()=>move(0,1);document.getElementById('r').onclick=()=>move(1,0);
  draw();
};

F.memory=()=>{const n=diffName==='easy'?6:diffName==='impossible'?10:8;const icons=['🍎','⭐','🌙','🔥','💎','🎵','🚀','🌈','🍀','🎯'].slice(0,n);let cards=[...icons,...icons].sort(()=>Math.random()-0.5),open=[],lock=0,m=0;
panel.innerHTML=`<div class="mem" id="mem" style="grid-template-columns:repeat(${n<=6?3:4},1fr)"></div><div class="score" id="sc">0 / ${n}</div>`;
const mem=document.getElementById('mem');cards.forEach((ico,i)=>{const b=document.createElement('button');b.textContent='❓';b.onclick=()=>{if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.textContent=ico;b.classList.add('open');open.push({b,i});
if(open.length===2){lock=1;const[a,c]=open;if(cards[a.i]===cards[c.i]){a.b.classList.add('done');c.b.classList.add('done');m++;open=[];lock=0;sc(m+' / '+n+(m===n?' · WIN!':''));}else setTimeout(()=>{a.b.textContent='❓';c.b.textContent='❓';a.b.classList.remove('open');c.b.classList.remove('open');open=[];lock=0;},400/D.spd);}};mem.appendChild(b);});};

F.ttt=()=>{let board=Array(9).fill(''),over=0;panel.innerHTML='<div class="ttt" id="ttt"></div><div class="msg" id="msg">Your turn (X)</div>';
const box=document.getElementById('ttt'),msg=document.getElementById('msg');
const win=p=>[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(l=>l.every(i=>board[i]===p));
function ren(){box.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v||'';b.onclick=()=>{if(over||board[i])return;board[i]='X';if(win('X')){over=1;msg.textContent='You win!';ren();return;}if(board.every(Boolean)){over=1;msg.textContent='Draw!';ren();return;}
ren();setTimeout(()=>{const empty=board.map((x,i)=>x?'':i).filter(x=>x!=='');let mv=null;
const smart=diffName!=='easy';if(smart){for(const i of empty){board[i]='O';if(win('O'))mv=i;board[i]='';if(mv!=null)break;}if(mv==null)for(const i of empty){board[i]='X';if(win('X'))mv=i;board[i]='';if(mv!=null)break;}}
if(mv==null)mv=empty[0|Math.random()*empty.length];board[mv]='O';if(win('O')){over=1;msg.textContent='CPU wins!';}else if(board.every(Boolean)){over=1;msg.textContent='Draw!';}else msg.textContent='Your turn (X)';ren();},250);};box.appendChild(b);});}ren();};

F.rps=()=>{let u=0,c=0;panel.innerHTML='<div class="msg" id="m">Pick!</div><div class="row"><button data-m="rock">✊</button><button data-m="paper">✋</button><button data-m="scissors">✌</button></div><div class="score" id="sc">0 — 0</div>';
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const you=b.dataset.m,cpu=['rock','paper','scissors'][0|Math.random()*3];let r='Draw';if(you===cpu)r='Draw';else if((you==='rock'&&cpu==='scissors')||(you==='paper'&&cpu==='rock')||(you==='scissors'&&cpu==='paper')){r='You win';u++;}else{r='CPU';c++;}
document.getElementById('m').textContent=you+' vs '+cpu+' · '+r;sc(u+' — '+c);});};

F.guess=()=>{const max=diffName==='easy'?20:diffName==='impossible'?100:50;let n=1+0|Math.random()*max,t=0;panel.innerHTML=`<div class="msg">Guess 1–${max}</div><input type="number" id="g"><div class="row"><button id="go">Guess</button></div><div class="msg" id="m"></div>`;
document.getElementById('go').onclick=()=>{const v=+document.getElementById('g').value;t++;document.getElementById('m').textContent=v===n?'Correct in '+t+'!':v<n?'Too low':'Too high';};};

F.react=()=>{panel.innerHTML='<div id="box" style="height:120px;border-radius:12px;background:#243044;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700">Wait...</div><div class="score" id="sc"></div><div class="row"><button id="rs">Go</button></div>';
const box=document.getElementById('box');let t0,ready=0,wait=0;const arm=()=>{box.style.background='#243044';box.textContent='Wait...';ready=0;wait=1;sc('');const delay=(diffName==='impossible'?400:800)+Math.random()*(2000/D.spd);timer=setTimeout(()=>{box.style.background='#6bcf9a';box.textContent='CLICK!';ready=1;t0=performance.now();},delay);};
box.onclick=()=>{if(wait&&!ready){clearTimeout(timer);box.textContent='Too soon!';wait=0;return;}if(ready){sc(Math.round(performance.now()-t0)+' ms · '+diffName);ready=wait=0;box.textContent='Nice!';}};document.getElementById('rs').onclick=arm;arm();};

F.whack=()=>{const T=D.time;panel.innerHTML='<div id="h" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;max-width:200px;margin:0 auto"></div><div class="score" id="sc">0 · '+T+'s</div>';
const h=document.getElementById('h');let score=0,time=T,act=-1;for(let i=0;i<9;i++){const b=document.createElement('button');b.style.cssText='aspect-ratio:1;border:0;border-radius:50%;background:#243044;font-size:1.3rem;cursor:pointer';b.onclick=()=>{if(i===act){score++;act=-1;b.textContent='';sc(score+' · '+time+'s');}};h.appendChild(b);}
const bs=[...h.children];timer=setInterval(()=>{time--;if(act>=0)bs[act].textContent='';act=0|Math.random()*9;bs[act].textContent='🐹';sc(score+' · '+time+'s');if(time<=0){clearInterval(timer);bs.forEach(b=>b.textContent='');sc('Final '+score+' · '+diffName);}},Math.max(400,900/D.spd));};

F.pong=()=>{const c=cv(320,220),ctx=c.getContext('2d');let px=120,ball={x:160,y:100,vx:2.2*D.spd,vy:-2.2*D.spd},score=0,lives=D.lives;

(function loop(){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<5||ball.x>315)ball.vx*=-1;if(ball.y<5)ball.vy*=-1;
if(ball.y>200&&ball.x>px&&ball.x<px+60){ball.vy=-Math.abs(ball.vy);ball.y=200;score++;}if(ball.y>225){lives--;ball={x:160,y:100,vx:2.2*D.spd,vy:-2.2*D.spd};if(lives<=0){sc('Over · '+score);return;}}
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,320,220);ctx.fillStyle='#5b9fd4';ctx.fillRect(px,205,60,8);ctx.fillStyle='#6bcf9a';ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,7);ctx.fill();sc(score+' · lives '+lives);raf=requestAnimationFrame(loop);})();};

F.breakout=()=>{const c=cv(320,240),ctx=c.getContext('2d');let px=130,ball={x:160,y:200,vx:2*D.spd,vy:-2.4*D.spd},br=[],score=0;for(let r=0;r<4;r++)for(let col=0;col<8;col++)br.push({x:10+col*38,y:18+r*16,w:34,h:11,a:1});
c.onmousemove=e=>{const r=c.getBoundingClientRect();px=Math.max(0,Math.min(260,(e.clientX-r.left)*320/r.width-30));};
(function loop(){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<5||ball.x>315)ball.vx*=-1;if(ball.y<5)ball.vy*=-1;if(ball.y>220&&ball.x>px&&ball.x<px+60){ball.vy=-Math.abs(ball.vy);ball.y=220;}if(ball.y>240){sc('Over · '+score);return;}
br.forEach(b=>{if(b.a&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.a=0;ball.vy*=-1;score+=10;}});if(br.every(b=>!b.a)){sc('WIN · '+score);return;}

F.flappy=()=>{const c=cv(300,240),ctx=c.getContext('2d');let y=100,vy=0,pipes=[{x:300,gap:70}],score=0,dead=0;const flap=()=>{if(!dead)vy=-5;};

const p=pipes[0];if(p.x<40&&p.x>0&&(y<p.gap||y>p.gap+65))dead=1;if(y>230||y<0)dead=1;
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,240);ctx.fillStyle='#6bcf9a';pipes.forEach(p=>{ctx.fillRect(p.x,0,34,p.gap);ctx.fillRect(p.x,p.gap+65,34,240);});ctx.fillStyle='#e8d44d';ctx.fillRect(28,y,14,14);sc(score);raf=requestAnimationFrame(loop);})();};

F.dodge=()=>{const c=cv(300,240),ctx=c.getContext('2d');let x=140,rocks=[],score=0,dead=0;
window.onkeydown=e=>{if(e.key==='ArrowLeft')x=Math.max(0,x-18);if(e.key==='ArrowRight')x=Math.min(280,x+18);e.preventDefault();};
c.onclick=e=>{const r=c.getBoundingClientRect();x=Math.max(0,Math.min(280,(e.clientX-r.left)*300/r.width-10));};
timer=setInterval(()=>rocks.push({x:Math.random()*280,y:-15,s:1.5*D.spd+Math.random()*D.spd}),Math.max(200,500/D.spd));
(function loop(){if(dead){sc('Over · '+score);return;}score++;rocks.forEach(r=>r.y+=r.s);rocks=rocks.filter(r=>{if(r.y>215&&r.y<240&&Math.abs(r.x-x)<16)dead=1;return r.y<260;});
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,240);ctx.fillStyle='#e88a8a';rocks.forEach(r=>{ctx.beginPath();ctx.arc(r.x,r.y,9,0,7);ctx.fill();});ctx.fillStyle='#5b9fd4';ctx.fillRect(x,220,18,12);sc(score);raf=requestAnimationFrame(loop);})();};

F.aim=()=>{const c=cv(300,220),ctx=c.getContext('2d');let targets=[],score=0,time=D.time;const spawn=()=>targets.push({x:40+Math.random()*220,y:30+Math.random()*140,r:12+Math.random()*8});
for(let i=0;i<3;i++)spawn();c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*300/r.width,my=(e.clientY-r.top)*220/r.height;targets=targets.filter(t=>{const hit=Math.hypot(t.x-mx,t.y-my)<t.r;if(hit)score++;return !hit;});};

F.math=()=>{let score=0,round=0,total=diffName==='easy'?5:10;const next=()=>{if(round>=total){panel.innerHTML=`<div class="msg">${score}/${total}</div>`;return;}round++;const a=1+0|Math.random()*(diffName==='impossible'?20:12),b=1+0|Math.random()*12,op=['+','-','×'][0|Math.random()*3];
let ans=op==='+'?a+b:op==='-'?a-b:a*b;if(op==='-'&&b>a){const t=a;/* swap handled */}const opts=new Set([ans]);while(opts.size<4)opts.add(ans+(0|Math.random()*11)-5);
panel.innerHTML=`<div class="msg">${a} ${op} ${b} = ?</div><div class="row" id="o"></div><div class="score">${round}/${total}</div>`;
[...opts].sort(()=>Math.random()-0.5).forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(o===ans)score++;next();};document.getElementById('o').appendChild(b);});};next();};

F.simon=()=>{const cols=['#e88a8a','#5b9fd4','#6bcf9a','#e8d44d'];let seq=[],player=[],busy=0;
panel.innerHTML='<div id="pads" style="display:grid;grid-template-columns:1fr 1fr;gap:.35rem;max-width:170px;margin:0 auto"></div><div class="score" id="sc">Start</div><div class="row"><button id="st">Start</button></div>';
const pads=document.getElementById('pads');cols.forEach((c,i)=>{const b=document.createElement('button');b.style.cssText=`height:64px;border:0;border-radius:10px;background:${c};opacity:.4;cursor:pointer`;b.dataset.i=i;pads.appendChild(b);});
const btns=[...pads.children];const flash=i=>new Promise(r=>{btns[i].style.opacity='1';setTimeout(()=>{btns[i].style.opacity='.4';setTimeout(r,120);},300/D.spd);});
const play=async()=>{busy=1;sc('Watch');for(const i of seq)await flash(i);busy=0;player=[];sc('Your turn');};
document.getElementById('st').onclick=()=>{seq=[0|Math.random()*4];play();};
btns.forEach(b=>b.onclick=async()=>{if(busy||!seq.length)return;const i=+b.dataset.i;player.push(i);await flash(i);
if(player[player.length-1]!==seq[player.length-1]){sc('Wrong · level '+(seq.length-1));seq=[];return;}
if(player.length===seq.length){sc('Level '+seq.length);seq.push(0|Math.random()*4);setTimeout(play,400);}});};

F.slider=()=>{let tiles=[1,2,3,4,5,6,7,8,0],empty=8;const shuffle=()=>{for(let i=0;i<60;i++){const x=empty%3,y=0|empty/3,m=[];[[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx>=0&&nx<3&&ny>=0&&ny<3)m.push(ny*3+nx);});const mv=m[0|Math.random()*m.length];tiles[empty]=tiles[mv];tiles[mv]=0;empty=mv;}};
const ren=()=>{panel.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;max-width:170px;margin:0 auto" id="sl"></div><div class="score" id="sc">Order 1–8</div><div class="row"><button id="sh">Shuffle</button></div>';
const sl=document.getElementById('sl');tiles.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t||'';b.style.cssText=`aspect-ratio:1;border:0;border-radius:8px;background:${t?'#243044':'#0a0e14'};color:var(--text);font-size:1.2rem;font-weight:800;cursor:pointer`;
b.onclick=()=>{const x=empty%3,y=0|empty/3,tx=i%3,ty=0|i/3;if(Math.abs(x-tx)+Math.abs(y-ty)===1){tiles[empty]=tiles[i];tiles[i]=0;empty=i;ren();if(tiles.every((v,idx)=>idx===8?v===0:v===idx+1))sc('Solved!');}};sl.appendChild(b);});
document.getElementById('sh').onclick=()=>{shuffle();ren();};};shuffle();ren();};

F.catch=()=>{const c=cv(300,220),ctx=c.getContext('2d');let x=130,items=[],score=0,time=D.time;

F.avoid=()=>{const c=cv(280,240),ctx=c.getContext('2d');let x=120,lanes=[0,1,0],score=0,dead=0;window.onkeydown=e=>{if(e.key==='ArrowLeft')x=Math.max(20,x-40);if(e.key==='ArrowRight')x=Math.min(220,x+40);};

(function loop(){if(dead){sc('Crash · '+score);return;}const lane=0|((x-20)/80);if(lanes[lanes.length-1]===lane&&score>3){/* hazard in same conceptual lane */;}

F.tap=()=>{const c=cv(280,200),ctx=c.getContext('2d');let circ={x:140,y:100,r:30,life:100},score=0,miss=0;

c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*280/r.width,my=(e.clientY-r.top)*200/r.height;if(Math.hypot(mx-circ.x,my-circ.y)<circ.r){score++;spawn();}else miss++;if(miss>=D.lives+2){sc('Over · '+score);circ=null;}};

F.balloon=()=>{const c=cv(300,220),ctx=c.getContext('2d');let balls=[],score=0,time=D.time;const spawn=()=>balls.push({x:Math.random()*280,y:220,vy:-(1+Math.random()*D.spd),r:12+Math.random()*10,c:['#e88a8a','#5b9fd4','#6bcf9a','#e8d44d'][0|Math.random()*4]});

(function loop(){if(time<=0)return;balls.forEach(b=>b.y+=b.vy);balls=balls.filter(b=>b.y>-20);ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,220);balls.forEach(b=>{ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();});sc(score+' · '+time+'s');raf=requestAnimationFrame(loop);})();};

F.stack=()=>{const c=cv(280,240),ctx=c.getContext('2d');let blocks=[{x:90,y:220,w:100}],cur={x:0,y:180,w:100,dir:1},score=0,spd=2*D.spd;

(function loop(){if(dead){sc('Hit · '+score);return;}lasers.forEach(l=>l.x-=3*D.spd);lasers=lasers.filter(l=>{if(l.x<x+12&&l.x+40>x&&Math.abs(l.y-y)<l.h)dead=1;return l.x>-50;});if(x>270){sc('WIN · '+score);return;}score++;
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,200);ctx.fillStyle='#e88a8a';lasers.forEach(l=>ctx.fillRect(l.x,l.y,40,4));ctx.fillStyle='#5b9fd4';ctx.fillRect(x,y,12,12);ctx.fillStyle='#6bcf9a';ctx.fillRect(290,0,10,200);sc(score);raf=requestAnimationFrame(loop);})();};

F.pixel=()=>{const N=diffName==='easy'?4:diffName==='impossible'?8:6;let filled=0,total=N*N;panel.innerHTML=`<div id="pg" style="display:grid;grid-template-columns:repeat(${N},1fr);gap:3px;max-width:200px;margin:0 auto"></div><div class="score" id="sc">0/${total}</div>`;
const pg=document.getElementById('pg');for(let i=0;i<total;i++){const b=document.createElement('button');b.style.cssText='aspect-ratio:1;border:0;border-radius:4px;background:#243044;cursor:pointer';b.onclick=()=>{if(b.dataset.f)return;b.dataset.f=1;b.style.background='#5b9fd4';filled++;sc(filled+'/'+total+(filled===total?' · DONE!':''));};pg.appendChild(b);}};

F.runner=()=>{const c=cv(320,160),ctx=c.getContext('2d');let y=120,vy=0,on=1,obs=[],score=0,dead=0;window.onkeydown=e=>{if((e.key===' '||e.key==='ArrowUp')&&on){vy=-8;on=0;e.preventDefault();}};c.onclick=()=>{if(on){vy=-8;on=0;}};
timer=setInterval(()=>obs.push({x:320,w:20+Math.random()*20}),Math.max(600,1200/D.spd));
(function loop(){if(dead){sc('Over · '+score);return;}vy+=0.5;y+=vy;if(y>=120){y=120;vy=0;on=1;}obs.forEach(o=>o.x-=4*D.spd);obs=obs.filter(o=>{if(o.x<50&&o.x>20&&y>100)dead=1;if(o.x<-30){score++;return false;}return true;});
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,320,160);ctx.fillStyle='#2a3548';ctx.fillRect(0,140,320,20);ctx.fillStyle='#e88a8a';obs.forEach(o=>ctx.fillRect(o.x,120,o.w,20));ctx.fillStyle='#5b9fd4';ctx.fillRect(30,y,16,20);sc(score);raf=requestAnimationFrame(loop);})();};

F.shoot=()=>{const c=cv(300,240),ctx=c.getContext('2d');let ship=140,bullets=[],asts=[],score=0;window.onkeydown=e=>{if(e.key==='ArrowLeft')ship=Math.max(10,ship-15);if(e.key==='ArrowRight')ship=Math.min(280,ship+15);if(e.key===' ')bullets.push({x:ship+8,y:210});};
c.onclick=()=>bullets.push({x:ship+8,y:210});timer=setInterval(()=>asts.push({x:Math.random()*280,y:-20,r:10+Math.random()*12,s:1+D.spd}),Math.max(400,800/D.spd));
(function loop(){bullets.forEach(b=>b.y-=6);asts.forEach(a=>a.y+=a.s);bullets=bullets.filter(b=>b.y>0);asts=asts.filter(a=>{let hit=0;bullets=bullets.filter(b=>{if(Math.hypot(b.x-a.x,b.y-a.y)<a.r){hit=1;score++;return false;}return true;});return !hit&&a.y<250;});
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,240);ctx.fillStyle='#5b9fd4';ctx.fillRect(ship,220,20,12);ctx.fillStyle='#e8d44d';bullets.forEach(b=>ctx.fillRect(b.x,b.y,3,8));ctx.fillStyle='#e88a8a';asts.forEach(a=>{ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,7);ctx.fill();});sc(score+' · space/click shoot');raf=requestAnimationFrame(loop);})();};

F.match3=()=>{const icons=['🍎','⭐','🌙','🔥','💎','🎵','🚀','🌈','🍀','🎯'];let a=icons[0|Math.random()*icons.length],b=icons[0|Math.random()*icons.length],score=0,left=D.time;
const show=()=>{panel.innerHTML=`<div class="msg" style="font-size:2rem">${a} ${b}</div><div class="row"><button id="yes">Match</button><button id="no">Different</button></div><div class="score" id="sc">${score} · ${left}s</div>`;
document.getElementById('yes').onclick=()=>{if(a===b)score++;else score=Math.max(0,score-1);a=icons[0|Math.random()*icons.length];b=Math.random()<0.45?a:icons[0|Math.random()*icons.length];show();};
document.getElementById('no').onclick=()=>{if(a!==b)score++;else score=Math.max(0,score-1);a=icons[0|Math.random()*icons.length];b=Math.random()<0.45?a:icons[0|Math.random()*icons.length];show();};};
show();timer=setInterval(()=>{left--;sc(score+' · '+left+'s');if(left<=0){clearInterval(timer);panel.innerHTML=`<div class="msg">Score ${score}</div>`;}},1000);};

F.timer=()=>{const target=2+Math.random()*3;panel.innerHTML=`<div class="msg">Stop as close as you can to ${target.toFixed(1)}s</div><div class="row"><button id="go">Start</button><button id="st" disabled>Stop</button></div><div class="msg" id="m"></div>`;
let t0;document.getElementById('go').onclick=()=>{t0=performance.now();document.getElementById('st').disabled=0;document.getElementById('m').textContent='Running...';};
document.getElementById('st').onclick=()=>{const t=(performance.now()-t0)/1000;const off=Math.abs(t-target);document.getElementById('m').textContent=t.toFixed(2)+'s · off by '+off.toFixed(2)+' · '+(off<0.15?'Perfect!':off<0.4?'Good':'Try again');document.getElementById('st').disabled=1;};};

F.arrow=()=>{const dirs=['↑','↓','←','→'];let seq=[],i=0,score=0;const next=()=>{seq=Array.from({length:3+0|D.spd},{()=>dirs[0|Math.random()*4]});i=0;panel.innerHTML=`<div class="msg" style="font-size:1.8rem">${seq.join(' ')}</div><div class="row" id="o"></div><div class="score" id="sc">${score}</div>`;
dirs.forEach(d=>{const b=document.createElement('button');b.textContent=d;b.onclick=()=>{if(d===seq[i]){i++;if(i>=seq.length){score++;next();}}else{sc('Miss · '+score);}};document.getElementById('o').appendChild(b);});};next();};

F.lights=()=>{const N=diffName==='easy'?3:3;let grid=Array.from({length:N},()=>Array(N).fill(0).map(()=>Math.random()>.5?1:0));
const ren=()=>{panel.innerHTML=`<div style="display:grid;grid-template-columns:repeat(${N},1fr);gap:4px;max-width:160px;margin:0 auto" id="lg"></div><div class="score" id="sc">Turn all off</div>`;
const lg=document.getElementById('lg');grid.forEach((row,y)=>row.forEach((v,x)=>{const b=document.createElement('button');b.style.cssText=`aspect-ratio:1;border:0;border-radius:6px;background:${v?'#e8d44d':'#243044'};cursor:pointer`;
b.onclick=()=>{[[0,0],[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx>=0&&nx<N&&ny>=0&&ny<N)grid[ny][nx]^=1;});ren();if(grid.every(r=>r.every(c=>!c)))sc('All off! WIN');};lg.appendChild(b);}));};ren();};

F.balance=()=>{const c=cv(280,120),ctx=c.getContext('2d');let x=140,vx=0,score=0,dead=0;window.onkeydown=e=>{if(e.key==='ArrowLeft')vx-=0.4;if(e.key==='ArrowRight')vx+=0.4;};
(function loop(){if(dead){sc('Fell · '+score);return;}vx+=(Math.random()-0.5)*0.15*D.spd;x+=vx;if(x<20||x>260)dead=1;score++;
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,280,120);ctx.fillStyle='#2a3548';ctx.fillRect(20,80,240,8);ctx.fillStyle='#5b9fd4';ctx.beginPath();ctx.arc(x,75,10,0,7);ctx.fill();sc(score);raf=requestAnimationFrame(loop);})();};

F.collect=()=>{const c=cv(300,220),ctx=c.getContext('2d');let x=150,y=110,stars=[],score=0,time=D.time;window.onkeydown=e=>{if(e.key==='ArrowLeft')x-=12;if(e.key==='ArrowRight')x+=12;if(e.key==='ArrowUp')y-=12;if(e.key==='ArrowDown')y+=12;x=Math.max(10,Math.min(290,x));y=Math.max(10,Math.min(210,y));};
const spawn=()=>stars.push({x:20+Math.random()*260,y:20+Math.random()*180});for(let i=0;i<5;i++)spawn();
timer=setInterval(()=>{time--;if(time<=0){clearInterval(timer);sc('Final '+score);}},1000);
(function loop(){if(time<=0)return;stars=stars.filter(s=>{if(Math.hypot(s.x-x,s.y-y)<16){score++;spawn();return false;}return true;});
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,220);ctx.fillStyle='#e8d44d';stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill();});ctx.fillStyle='#5b9fd4';ctx.fillRect(x-8,y-8,16,16);sc(score+' · '+time+'s');raf=requestAnimationFrame(loop);})();};

F.walls=()=>{const c=cv(280,240),ctx=c.getContext('2d');let x=40,y=200,vy=0,side=0,score=0;window.onkeydown=e=>{if(e.key===' '||e.key==='ArrowUp'){vy=-6;side^=1;e.preventDefault();}};
(function loop(){vy+=0.25;y+=vy;x+=(side?2:-2)*D.spd;if(x<20){x=20;side=1;}if(x>250){x=250;side=0;}if(y>220){y=220;vy=0;score=0;}if(y<30){score++;y=40;}
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,280,240);ctx.fillStyle='#2a3548';ctx.fillRect(0,0,18,240);ctx.fillRect(262,0,18,240);ctx.fillStyle='#5b9fd4';ctx.fillRect(x,y,12,12);sc(score+' · space jump');raf=requestAnimationFrame(loop);})();};

F.orbit=()=>{const c=cv(280,240),ctx=c.getContext('2d');let ang=0,rad=60,score=0,dead=0;window.onkeydown=e=>{if(e.key==='ArrowUp')rad=Math.min(100,rad+5);if(e.key==='ArrowDown')rad=Math.max(25,rad-5);};
const hazards=[];timer=setInterval(()=>hazards.push({ang:Math.random()*6.28,r:40+Math.random()*50}),800);
(function loop(){if(dead){sc('Hit · '+score);return;}ang+=0.04*D.spd;score++;const px=140+Math.cos(ang)*rad,py=120+Math.sin(ang)*rad;
hazards.forEach(h=>{if(Math.abs(h.r-rad)<12&&Math.abs(((h.ang-ang+Math.PI)%(Math.PI*2))-Math.PI)<0.15)dead=1;});
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,280,240);ctx.strokeStyle='#2a3548';ctx.beginPath();ctx.arc(140,120,rad,0,7);ctx.stroke();
ctx.fillStyle='#e88a8a';hazards.forEach(h=>{ctx.beginPath();ctx.arc(140+Math.cos(h.ang)*h.r,120+Math.sin(h.ang)*h.r,6,0,7);ctx.fill();});
ctx.fillStyle='#5b9fd4';ctx.beginPath();ctx.arc(px,py,8,0,7);ctx.fill();sc(score);raf=requestAnimationFrame(loop);})();};

F.fuse=()=>{const wires=['red','blue','green','yellow'];const safe=wires[0|Math.random()*wires.length];panel.innerHTML=`<div class="msg">Cut the safe wire! (${diffName})</div><div class="row" id="o"></div><div class="msg" id="m"></div>`;
wires.forEach(w=>{const b=document.createElement('button');b.textContent=w;b.style.background=w==='red'?'#e88a8a':w==='blue'?'#5b9fd4':w==='green'?'#6bcf9a':'#e8d44d';b.onclick=()=>{document.getElementById('m').textContent=w===safe?'Defused! 🎉':'Boom! Safe was '+safe;};document.getElementById('o').appendChild(b);});};

F.rhythm=()=>{let beat=0,score=0,miss=0;panel.innerHTML='<div class="msg" id="m">Tap on the pulse</div><div style="height:20px;background:#243044;border-radius:8px;overflow:hidden"><div id="bar" style="height:100%;width:0;background:var(--accent)"></div></div><div class="row"><button id="tap">TAP</button></div><div class="score" id="sc">0</div>';
const bar=document.getElementById('bar');const period=Math.max(400,1000/D.spd);let t0=performance.now();
timer=setInterval(()=>{beat++;},period);
(function loop(){const p=((performance.now()-t0)%period)/period;bar.style.width=(p*100)+'%';raf=requestAnimationFrame(loop);})();
document.getElementById('tap').onclick=()=>{const p=((performance.now()-t0)%period)/period;if(p>0.85||p<0.15){score++;sc(score);}else{miss++;sc(score+' · miss '+miss);};};

F.shadow=()=>{const shapes=[['●','circle'],['■','square'],['▲','triangle'],['◆','diamond']];let score=0,round=0;const next=()=>{if(round>=6){panel.innerHTML=`<div class="msg">${score}/6</div>`;return;}round++;const s=shapes[0|Math.random()*shapes.length];
panel.innerHTML=`<div class="msg" style="font-size:2.5rem;filter:brightness(0)"> ${s[0]} </div><div class="row" id="o"></div>`;
shapes.map(x=>x[1]).sort(()=>Math.random()-0.5).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(n===s[1])score++;next();};document.getElementById('o').appendChild(b);});};next();};

F.zoom=()=>{const c=cv(280,200),ctx=c.getContext('2d');const tx=40+Math.random()*200,ty=40+Math.random()*120;let found=0;
c.onclick=e=>{const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*280/r.width,my=(e.clientY-r.top)*200/r.height;if(Math.hypot(mx-tx,my-ty)<12){found=1;sc('Found it!');}else sc('Keep looking...');};
(function loop(){ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,280,200);ctx.fillStyle=found?'#6bcf9a':'#2a3548';ctx.fillRect(tx-3,ty-3,6,6);if(!found)sc('Find the tiny mark');raf=requestAnimationFrame(loop);})();};

F.gravity=()=>{const c=cv(280,220),ctx=c.getContext('2d');let y=40,vy=0,g=0.35,flipped=0,score=0;window.onkeydown=e=>{if(e.key===' '){g*=-1;flipped^=1;e.preventDefault();}};
c.onclick=()=>{g*=-1;flipped^=1;};
(function loop(){vy+=g;y+=vy;if(y>200||y<20){vy*=-0.3;y=y>200?200:20;score++;}
ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,280,220);ctx.fillStyle='#2a3548';ctx.fillRect(0,0,280,12);ctx.fillRect(0,208,280,12);ctx.fillStyle='#5b9fd4';ctx.fillRect(130,y,16,16);sc(score+' · tap flip gravity');raf=requestAnimationFrame(loop);})();};

F.portal=()=>{const c=cv(300,220),ctx=c.getContext('2d');let x=30,y=110,portal={x:260,y:100},won=0;window.onkeydown=e=>{if(e.key==='ArrowLeft')x-=10;if(e.key==='ArrowRight')x+=10;if(e.key==='ArrowUp')y-=10;if(e.key==='ArrowDown')y+=10;x=Math.max(5,Math.min(285,x));y=Math.max(5,Math.min(205,y));if(Math.hypot(x-portal.x,y-portal.y)<20)won=1;};
(function loop(){if(won){sc('Portal reached! 🎉');return;}ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,220);ctx.fillStyle='#b48ce8';ctx.beginPath();ctx.arc(portal.x,portal.y,16,0,7);ctx.fill();ctx.fillStyle='#5b9fd4';ctx.fillRect(x,y,14,14);sc('Arrows to purple portal');raf=requestAnimationFrame(loop);})();};

F.ice=()=>{const c=cv(280,240),ctx=c.getContext('2d');const N=7,cell=36;let px=0,py=0,gx=N-1,gy=N-1,moving=0;
const walls=Array.from({length:N},()=>Array(N).fill(0));for(let i=0;i<N*2;i++)walls[0|Math.random()*N][0|Math.random()*N]=1;walls[0][0]=walls[gx][gy]=0;
const slide=(dx,dy)=>{if(moving)return;moving=1;const iv=setInterval(()=>{const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=N||ny>=N||walls[ny][nx]){clearInterval(iv);moving=0;if(px===gx&&py===gy)sc('Goal! 🎉');return;}px=nx;py=ny;draw();},50/D.spd);};
window.onkeydown=e=>{if(e.key==='ArrowLeft')slide(-1,0);if(e.key==='ArrowRight')slide(1,0);if(e.key==='ArrowUp')slide(0,-1);if(e.key==='ArrowDown')slide(0,1);e.preventDefault();};
function draw(){ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,280,240);for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=walls[y][x]?'#2a3548':'#1a3040';ctx.fillRect(x*cell,y*cell,cell-2,cell-2);}
ctx.fillStyle='#6bcf9a';ctx.fillRect(gx*cell+8,gy*cell+8,cell-16,cell-16);ctx.fillStyle='#5b9fd4';ctx.fillRect(px*cell+8,py*cell+8,cell-16,cell-16);sc('Slide to green · ice physics');}draw();};

F.boss=()=>{const c=cv(300,240),ctx=c.getContext('2d');let x=140,hp=5*D.lives,enemies=[],score=0,wave=1;window.onkeydown=e=>{if(e.key==='ArrowLeft')x=Math.max(10,x-20);if(e.key==='ArrowRight')x=Math.min(270,x+20);if(e.key===' ')enemies.push({x:x+10,y:200,vy:-5,friendly:1});};
const spawn=()=>{for(let i=0;i<wave;i++)enemies.push({x:Math.random()*280,y:-20,vy:1+D.spd*0.5,friendly:0,hp:1});};
spawn();timer=setInterval(spawn,Math.max(1500,3000/D.spd));
(function loop(){if(hp<=0){sc('Defeated · score '+score);return;}enemies.forEach(e=>e.y+=e.vy);enemies=enemies.filter(e=>{if(!e.friendly&&e.y>210&&Math.abs(e.x-x)<25){hp--;return false;}if(e.friendly){const hit=enemies.find(o=>!o.friendly&&Math.hypot(o.x-e.x,o.y-e.y)<15);if(hit){hit.hp--;score+=10;if(hit.hp<=0)enemies=enemies.filter(o=>o!==hit);return false;}return e.y>0;}return e.y<250;});
if(score>wave*50)wave++;ctx.fillStyle='#0a0e14';ctx.fillRect(0,0,300,240);ctx.fillStyle='#5b9fd4';ctx.fillRect(x,215,24,12);ctx.fillStyle='#e88a8a';enemies.filter(e=>!e.friendly).forEach(e=>{ctx.fillRect(e.x,e.y,14,14);});ctx.fillStyle='#e8d44d';enemies.filter(e=>e.friendly).forEach(e=>{ctx.fillRect(e.x,e.y,4,8);});sc('HP '+hp+' · '+score+' · wave '+wave);raf=requestAnimationFrame(loop);})();};
</script></body></html>
