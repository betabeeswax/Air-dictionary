<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIR Mini Games</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--text:#e8eef7;--muted:#8b9bb4;--accent:#5b9fd4;--ok:#6bcf9a;--border:#2a3548}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
.wrap{min-height:100%;max-width:900px;margin:0 auto;padding:0.8rem 1rem 1.5rem;display:flex;flex-direction:column}
.logo{text-align:center;flex-shrink:0}
.logo .air{font-size:1.7rem;font-weight:800;color:var(--accent)}
.logo .dict{font-size:.9rem;color:#e8eef7}
.modes{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin:.5rem 0;flex-shrink:0}
.modes a{padding:.3rem .65rem;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--accent);text-decoration:none;font-size:.8rem;font-weight:600}
.modes a.active{background:var(--accent);color:#041018}
h1{font-size:1.05rem;text-align:center;margin:.3rem 0 .6rem;flex-shrink:0}
#menu{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:.45rem;
  align-content:start;
  min-height:0;
}
.gbtn{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.75rem .6rem;cursor:pointer;text-align:left;color:var(--text);
  min-height:88px;display:flex;flex-direction:column;justify-content:center;
}
.gbtn:hover{border-color:var(--accent)}
.gbtn .ico{font-size:1.25rem}
.gbtn .name{font-weight:700;font-size:.85rem;margin-top:.2rem}
.gbtn .desc{font-size:.68rem;color:var(--muted);margin-top:.1rem}
#play{display:none;flex:1;flex-direction:column;min-height:0}
#playBar{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.5rem;flex-shrink:0;flex-wrap:wrap}
#playTitle{font-weight:700;color:var(--accent);font-size:.95rem}
#playBar button{padding:.35rem .7rem;border:0;border-radius:8px;background:var(--border);color:var(--text);cursor:pointer;font-weight:600}
#diffBar{display:none;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-bottom:.55rem;padding:.45rem;background:var(--card);border:1px solid var(--border);border-radius:10px;flex-shrink:0}
#diffBar.show{display:flex}
#diffBar span{width:100%;text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:.15rem}
#diffBar button{padding:.28rem .5rem;border-radius:8px;border:1px solid var(--border);background:#121a24;color:var(--muted);font-size:.72rem;font-weight:700;cursor:pointer}
#diffBar button.on{background:var(--accent);color:#041018;border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-align:center;flex:1}
canvas{background:#0a0e14;border-radius:8px;display:block;margin:0 auto;max-width:100%}
.row{display:flex;gap:.35rem;justify-content:center;flex-wrap:wrap;margin-top:.45rem}
.row button{padding:.4rem .7rem;border:0;border-radius:8px;background:var(--accent);color:#041018;font-weight:700;cursor:pointer;font-size:.85rem}
.score,.msg{color:var(--muted);font-size:.85rem;margin-top:.35rem}.msg{color:var(--text)}
.mem,.ttt{display:grid;gap:.3rem;margin:0 auto}
.mem{grid-template-columns:repeat(4,1fr);max-width:260px}
.ttt{grid-template-columns:repeat(3,1fr);max-width:190px}
.mem button,.ttt button{aspect-ratio:1;border:0;border-radius:8px;background:#243044;color:var(--text);font-size:1.15rem;cursor:pointer;font-weight:700}
input[type=number],input[type=text]{padding:.45rem;border-radius:8px;border:1px solid var(--border);background:#121a24;color:var(--text);width:120px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:.8rem;flex-shrink:0}
footer a{color:var(--accent)}
</style>
</head><body>
<div class="wrap">
  <div class="logo"><div class="air">ΛIR</div><div class="dict">Mini Games</div></div>
  <div class="modes">
    <a href="index.html">Lite</a>
    <a href="full.html">Full</a>
    <a href="google.html">Google It</a>
    <a href="games.html" class="active">Games</a>
  </div>
  <h1>Pick a game</h1>
  <div id="menu"></div>
  <div id="play">
    <div id="playBar">
      <span id="playTitle">Game</span>
      <button type="button" id="backBtn">← Menu</button>
    </div>
    <div id="diffBar">
      <span>Difficulty for this game</span>
      <button type="button" data-d="easy" class="on">Easy</button>
      <button type="button" data-d="medium">Medium</button>
      <button type="button" data-d="hard">Hard</button>
      <button type="button" data-d="extreme">Extreme</button>
      <button type="button" data-d="impossible">Impossible</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>
  <footer><a href="index.html">Back to Dictionary</a></footer>
</div>
<script>
(function(){
const DIFF = {
  easy:       {spd:1,   lives:5, time:30, grid:8},
  medium:     {spd:1.3, lives:3, time:20, grid:10},
  hard:       {spd:1.7, lives:2, time:15, grid:12},
  extreme:    {spd:2.2, lives:1, time:10, grid:14},
  impossible: {spd:3,   lives:1, time:7,  grid:16}
};
let D = DIFF.easy, diffName = 'easy', currentGame = null, needsDiff = false;
let timer = null, raf = null;

const NEEDS_DIFF = {
  platform:1,snake:1,maze:1,memory:1,ttt:1,react:1,whack:1,clicker:1,pong:1,breakout:1,
  flappy:1,dodge:1,aim:1,simon:1,catch:1,tap:1,balloon:1,stack:1,runner:1,shoot:1,
  match3:1,boss:1,ice:1,laser:1,orbit:1,balance:1,collect:1
};

const GAMES = [
  {id:'platform',ico:'🟩',n:'Platformer',d:'Jump & coins'},
  {id:'snake',ico:'🐍',n:'Snake',d:'Grow the snake'},
  {id:'memory',ico:'🧠',n:'Memory',d:'Match pairs'},
  {id:'ttt',ico:'⭕',n:'Tic Tac Toe',d:'Vs computer'},
  {id:'rps',ico:'✊',n:'RPS',d:'Rock paper scissors'},
  {id:'guess',ico:'🔢',n:'Number Guess',d:'Guess 1–50'},
  {id:'react',ico:'⚡',n:'Reaction',d:'Click on green'},
  {id:'whack',ico:'🐹',n:'Whack-a-Mole',d:'Hit moles'},
  {id:'clicker',ico:'👆',n:'Speed Click',d:'Click rush'},
  {id:'color',ico:'🎨',n:'Color Match',d:'Name colors'},
  {id:'type',ico:'⌨️',n:'Type Race',d:'Type fast'},
  {id:'pong',ico:'🏓',n:'Pong',d:'Bounce ball'},
  {id:'breakout',ico:'🧱',n:'Breakout',d:'Break bricks'},
  {id:'flappy',ico:'🐤',n:'Flappy',d:'Tap to fly'},
  {id:'dodge',ico:'☄️',n:'Dodge',d:'Avoid rocks'},
  {id:'aim',ico:'🎯',n:'Target Aim',d:'Hit targets'},
  {id:'math',ico:'➕',n:'Math Blitz',d:'Quick math'},
  {id:'simon',ico:'🔔',n:'Simon',d:'Repeat pattern'},
  {id:'maze',ico:'🌀',n:'Maze Run',d:'Reach the END'},
  {id:'slider',ico:'🧩',n:'Slide Puzzle',d:'3×3 puzzle'},
  {id:'catch',ico:'🧺',n:'Catch',d:'Catch items'},
  {id:'tap',ico:'🔵',n:'Tap Circle',d:'Tap before gone'},
  {id:'hold',ico:'⏱️',n:'Hold Steady',d:'Release on time'},
  {id:'count',ico:'👀',n:'Quick Count',d:'Count dots'},
  {id:'odd',ico:'🔍',n:'Find Odd',d:'Find different'},
  {id:'balloon',ico:'🎈',n:'Balloons',d:'Pop balloons'},
  {id:'stack',ico:'📦',n:'Stack',d:'Stack blocks'},
  {id:'bounce',ico:'⚽',n:'Keep Up',d:'Keep ball up'},
  {id:'runner',ico:'🏃',n:'Runner',d:'Jump obstacles'},
  {id:'shoot',ico:'🚀',n:'Space Shot',d:'Shoot rocks'},
  {id:'match3',ico:'🍬',n:'Match Check',d:'Same or different'},
  {id:'timer',ico:'⏰',n:'Exact Timer',d:'Stop on time'},
  {id:'lights',ico:'💡',n:'Lights Out',d:'Turn all off'},
  {id:'collect',ico:'⭐',n:'Star Collect',d:'Grab stars'},
  {id:'portal',ico:'🟣',n:'Portal Hop',d:'Reach portal'},
  {id:'boss',ico:'👾',n:'Boss Rush',d:'Survive waves'}
];

const menu = document.getElementById('menu');
const play = document.getElementById('play');
const panel = document.getElementById('panel');
const playTitle = document.getElementById('playTitle');
const diffBar = document.getElementById('diffBar');
const backBtn = document.getElementById('backBtn');

function clearT(){
  if(timer) clearInterval(timer);
  if(raf) cancelAnimationFrame(raf);
  timer = raf = null;
  window.onkeydown = null;
  window.onkeyup = null;
}

function sc(t){
  const e = document.getElementById('sc');
  if(e) e.textContent = t;
}

function cv(w,h){
  panel.innerHTML = '<canvas id="c" width="'+w+'" height="'+h+'"></canvas><div class="score" id="sc"></div><div class="row" id="ctrls"></div>';
  return document.getElementById('c');
}

// Build menu
GAMES.forEach(function(g){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'gbtn';
  b.innerHTML = '<div class="ico">'+g.ico+'</div><div class="name">'+g.n+'</div><div class="desc">'+g.d+'</div>';
  b.onclick = function(){ startGame(g); };
  menu.appendChild(b);
});

function startGame(g){
  clearT();
  currentGame = g.id;
  needsDiff = !!NEEDS_DIFF[g.id];
  menu.style.display = 'none';
  document.querySelector('h1').style.display = 'none';
  play.style.display = 'flex';
  playTitle.textContent = g.n;
  if(needsDiff){
    diffBar.classList.add('show');
  } else {
    diffBar.classList.remove('show');
  }
  panel.innerHTML = '';
  if(typeof F[g.id] === 'function') F[g.id]();
  else panel.innerHTML = '<div class="msg">Game not found</div>';
}

backBtn.onclick = function(){
  clearT();
  play.style.display = 'none';
  menu.style.display = 'grid';
  document.querySelector('h1').style.display = 'block';
  currentGame = null;
};

// Difficulty buttons — only restart current game if it needs diff
document.querySelectorAll('#diffBar button[data-d]').forEach(function(btn){
  btn.onclick = function(){
    document.querySelectorAll('#diffBar button[data-d]').forEach(function(x){ x.classList.remove('on'); });
    btn.classList.add('on');
    diffName = btn.getAttribute('data-d');
    D = DIFF[diffName];
    if(currentGame && needsDiff && typeof F[currentGame] === 'function'){
      clearT();
      panel.innerHTML = '';
      F[currentGame]();
    }
  };
});

const F = {};

F.snake = function(){
  const c = cv(320,256), ctx = c.getContext('2d');
  const S=16, C=20, R=16, spd = Math.max(50, 140/D.spd);
  document.getElementById('ctrls').innerHTML = '<button type="button" data-d="u">↑</button><button type="button" data-d="l">←</button><button type="button" data-d="d">↓</button><button type="button" data-d="r">→</button>';
  let sn=[{x:10,y:8}], dir={x:1,y:0}, food={x:15,y:8}, score=0, ok=1;
  function place(){ food={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)}; if(sn.some(function(s){return s.x===food.x&&s.y===food.y;})) place(); }
  function draw(){
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,320,256);
    ctx.fillStyle='#6bcf9a'; sn.forEach(function(s){ ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2); });
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(food.x*S+1,food.y*S+1,S-2,S-2);
    sc('Score '+score+(ok?'':' · GAME OVER')+' · '+diffName);
  }
  function step(){
    if(!ok) return;
    const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=C||h.y>=R||sn.some(function(s){return s.x===h.x&&s.y===h.y;})){ ok=0; draw(); return; }
    sn.unshift(h);
    if(h.x===food.x&&h.y===food.y){ score++; place(); } else sn.pop();
    draw();
  }
  window.onkeydown = function(e){
    if(e.key==='ArrowUp'&&!dir.y) dir={x:0,y:-1};
    if(e.key==='ArrowDown'&&!dir.y) dir={x:0,y:1};
    if(e.key==='ArrowLeft'&&!dir.x) dir={x:-1,y:0};
    if(e.key==='ArrowRight'&&!dir.x) dir={x:1,y:0};
    e.preventDefault();
  };
  document.querySelectorAll('#ctrls [data-d]').forEach(function(b){
    b.onclick = function(){
      const d=b.getAttribute('data-d');
      if(d==='u'&&!dir.y) dir={x:0,y:-1};
      if(d==='d'&&!dir.y) dir={x:0,y:1};
      if(d==='l'&&!dir.x) dir={x:-1,y:0};
      if(d==='r'&&!dir.x) dir={x:1,y:0};
    };
  });
  place(); draw();
  timer = setInterval(step, spd);
};

F.maze = function(){
  const N = D.grid;
  const cell = Math.min(22, Math.floor(300/N));
  const size = N*cell;
  const c = cv(size, size), ctx = c.getContext('2d');
  const grid = [];
  for(let y=0;y<N;y++){ grid[y]=[]; for(let x=0;x<N;x++) grid[y][x]=1; }
  function carve(x,y){
    grid[y][x]=0;
    const dirs=[[0,-1],[1,0],[0,1],[-1,0]].sort(function(){return Math.random()-0.5;});
    for(let i=0;i<dirs.length;i++){
      const dx=dirs[i][0], dy=dirs[i][1];
      const nx=x+dx*2, ny=y+dy*2;
      if(ny>=0&&ny<N&&nx>=0&&nx<N&&grid[ny][nx]===1){ grid[y+dy][x+dx]=0; carve(nx,ny); }
    }
  }
  carve(0,0);
  grid[N-1][N-1]=0; grid[N-1][Math.max(0,N-2)]=0; grid[Math.max(0,N-2)][N-1]=0;
  let px=0, py=0, won=0;
  function draw(){
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,size,size);
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      ctx.fillStyle = grid[y][x] ? '#2a3548' : '#121a24';
      ctx.fillRect(x*cell,y*cell,cell-1,cell-1);
    }
    ctx.fillStyle='#6bcf9a';
    ctx.fillRect((N-1)*cell+3,(N-1)*cell+3,cell-6,cell-6);
    ctx.fillStyle='#041018';
    ctx.font = 'bold '+Math.max(9,cell-10)+'px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('END', (N-1)*cell+cell/2, (N-1)*cell+cell/2);
    ctx.fillStyle='#5b9fd4';
    ctx.fillRect(px*cell+4, py*cell+4, cell-8, cell-8);
    sc(won ? 'YOU REACHED THE END! · '+diffName : 'Go to green END · '+diffName);
  }
  function move(dx,dy){
    if(won) return;
    const nx=px+dx, ny=py+dy;
    if(nx>=0&&ny>=0&&nx<N&&ny<N&&!grid[ny][nx]){ px=nx; py=ny; if(px===N-1&&py===N-1) won=1; draw(); }
  }
  window.onkeydown = function(e){
    if(e.key==='ArrowLeft') move(-1,0);
    if(e.key==='ArrowRight') move(1,0);
    if(e.key==='ArrowUp') move(0,-1);
    if(e.key==='ArrowDown') move(0,1);
    e.preventDefault();
  };
  document.getElementById('ctrls').innerHTML = '<button type="button" id="mu">↑</button><button type="button" id="ml">←</button><button type="button" id="md">↓</button><button type="button" id="mr">→</button>';
  document.getElementById('mu').onclick=function(){move(0,-1);};
  document.getElementById('ml').onclick=function(){move(-1,0);};
  document.getElementById('md').onclick=function(){move(0,1);};
  document.getElementById('mr').onclick=function(){move(1,0);};
  draw();
};

F.platform = function(){
  const c=cv(360,240), ctx=c.getContext('2d');
  const g=0.4*D.spd;
  document.getElementById('ctrls').innerHTML='<span style="color:var(--muted);font-size:.75rem">← → move · Space jump</span>';
  const plats=[{x:0,y:220,w:360,h:20},{x:30,y:165,w:70,h:12},{x:140,y:125,w:70,h:12},{x:250,y:85,w:70,h:12},{x:60,y:55,w:50,h:12}];
  let p={x:20,y:180,vx:0,vy:0,w:14,h:18,on:0};
  let coins=[{x:55,y:145},{x:165,y:105},{x:275,y:65},{x:80,y:35}];
  let got=0, keys={};
  window.onkeydown=function(e){ keys[e.key]=1; if(['ArrowLeft','ArrowRight',' ','ArrowUp'].indexOf(e.key)>=0) e.preventDefault(); };
  window.onkeyup=function(e){ keys[e.key]=0; };
  function loop(){
    p.vx = (keys.ArrowLeft||keys.a?-3:0)+(keys.ArrowRight||keys.d?3:0);
    if((keys[' ']||keys.ArrowUp||keys.w)&&p.on) p.vy=-7.5/Math.sqrt(D.spd);
    p.vy+=g; p.x+=p.vx; p.y+=p.vy; p.on=0;
    if(p.x<0)p.x=0; if(p.x>346)p.x=346;
    for(let i=0;i<plats.length;i++){
      const pl=plats[i];
      if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+16&&p.vy>=0){ p.y=pl.y-p.h; p.vy=0; p.on=1; }
    }
    if(p.y>250){ p.x=20; p.y=180; p.vy=0; }
    coins = coins.filter(function(co){
      if(Math.hypot(p.x+7-co.x,p.y+9-co.y)<14){ got++; return false; }
      return true;
    });
    if(!coins.length){ sc('YOU WIN! · '+diffName); return; }
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,360,240);
    ctx.fillStyle='#2a3548'; plats.forEach(function(pl){ ctx.fillRect(pl.x,pl.y,pl.w,pl.h); });
    ctx.fillStyle='#e8d44d'; coins.forEach(function(co){ ctx.beginPath(); ctx.arc(co.x,co.y,6,0,7); ctx.fill(); });
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(p.x,p.y,p.w,p.h);
    sc('Coins '+got+'/4 · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.memory = function(){
  const n = diffName==='easy'?6 : (diffName==='impossible'?10:8);
  const icons=['🍎','⭐','🌙','🔥','💎','🎵','🚀','🌈','🍀','🎯'].slice(0,n);
  let cards = icons.concat(icons).sort(function(){return Math.random()-0.5;});
  let open=[], lock=0, m=0;
  panel.innerHTML='<div class="mem" id="mem" style="grid-template-columns:repeat('+(n<=6?3:4)+',1fr)"></div><div class="score" id="sc">0 / '+n+'</div>';
  const mem=document.getElementById('mem');
  cards.forEach(function(ico,i){
    const b=document.createElement('button'); b.type='button'; b.textContent='❓';
    b.onclick=function(){
      if(lock||b.classList.contains('open')||b.classList.contains('done')) return;
      b.textContent=ico; b.classList.add('open'); open.push({b:b,i:i});
      if(open.length===2){
        lock=1; const a=open[0], c=open[1];
        if(cards[a.i]===cards[c.i]){
          a.b.classList.add('done'); c.b.classList.add('done'); m++; open=[]; lock=0;
          sc(m+' / '+n+(m===n?' · WIN!':''));
        } else {
          setTimeout(function(){ a.b.textContent='❓'; c.b.textContent='❓'; a.b.classList.remove('open'); c.b.classList.remove('open'); open=[]; lock=0; }, 450);
        }
      }
    };
    mem.appendChild(b);
  });
};

F.ttt = function(){
  let board=Array(9).fill(''), over=0;
  panel.innerHTML='<div class="ttt" id="ttt"></div><div class="msg" id="msg">Your turn (X)</div>';
  const box=document.getElementById('ttt'), msg=document.getElementById('msg');
  function win(p){ return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(function(l){return l.every(function(i){return board[i]===p;});}); }
  function ren(){
    box.innerHTML='';
    board.forEach(function(v,i){
      const b=document.createElement('button'); b.type='button'; b.textContent=v||'';
      b.onclick=function(){
        if(over||board[i]) return;
        board[i]='X';
        if(win('X')){ over=1; msg.textContent='You win!'; ren(); return; }
        if(board.every(Boolean)){ over=1; msg.textContent='Draw!'; ren(); return; }
        ren();
        setTimeout(function(){
          const empty=[]; for(let j=0;j<9;j++) if(!board[j]) empty.push(j);
          let mv=null;
          if(diffName!=='easy'){
            for(let k=0;k<empty.length;k++){ board[empty[k]]='O'; if(win('O')) mv=empty[k]; board[empty[k]]=''; if(mv!=null) break; }
            if(mv==null) for(let k=0;k<empty.length;k++){ board[empty[k]]='X'; if(win('X')) mv=empty[k]; board[empty[k]]=''; if(mv!=null) break; }
          }
          if(mv==null) mv=empty[Math.floor(Math.random()*empty.length)];
          board[mv]='O';
          if(win('O')){ over=1; msg.textContent='CPU wins!'; }
          else if(board.every(Boolean)){ over=1; msg.textContent='Draw!'; }
          else msg.textContent='Your turn (X)';
          ren();
        }, 280);
      };
      box.appendChild(b);
    });
  }
  ren();
};

F.rps = function(){
  let u=0,c=0;
  panel.innerHTML='<div class="msg" id="m">Pick one!</div><div class="row"><button type="button" data-m="rock">✊</button><button type="button" data-m="paper">✋</button><button type="button" data-m="scissors">✌</button></div><div class="score" id="sc">0 — 0</div>';
  panel.querySelectorAll('[data-m]').forEach(function(b){
    b.onclick=function(){
      const you=b.getAttribute('data-m'), cpu=['rock','paper','scissors'][Math.floor(Math.random()*3)];
      let r='Draw';
      if(you===cpu) r='Draw';
      else if((you==='rock'&&cpu==='scissors')||(you==='paper'&&cpu==='rock')||(you==='scissors'&&cpu==='paper')){ r='You win'; u++; }
      else { r='CPU'; c++; }
      document.getElementById('m').textContent=you+' vs '+cpu+' · '+r;
      sc(u+' — '+c);
    };
  });
};

F.guess = function(){
  const max = diffName==='easy'?20 : (diffName==='impossible'?100:50);
  let n=1+Math.floor(Math.random()*max), t=0;
  panel.innerHTML='<div class="msg">Guess 1–'+max+'</div><input type="number" id="g"><div class="row"><button type="button" id="go">Guess</button></div><div class="msg" id="m"></div>';
  document.getElementById('go').onclick=function(){
    const v=+document.getElementById('g').value; t++;
    document.getElementById('m').textContent = v===n ? 'Correct in '+t+'!' : (v<n?'Too low':'Too high');
  };
};

F.react = function(){
  panel.innerHTML='<div id="box" style="height:120px;border-radius:12px;background:#243044;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700">Wait...</div><div class="score" id="sc"></div><div class="row"><button type="button" id="rs">Go</button></div>';
  const box=document.getElementById('box');
  let t0=0, ready=0, wait=0;
  function arm(){
    box.style.background='#243044'; box.textContent='Wait...'; ready=0; wait=1; sc('');
    const delay = (diffName==='impossible'?400:800) + Math.random()*(2000/D.spd);
    timer = setTimeout(function(){ box.style.background='#6bcf9a'; box.textContent='CLICK!'; ready=1; t0=performance.now(); }, delay);
  }
  box.onclick=function(){
    if(wait&&!ready){ clearTimeout(timer); box.textContent='Too soon!'; wait=0; return; }
    if(ready){ sc(Math.round(performance.now()-t0)+' ms · '+diffName); ready=wait=0; box.textContent='Nice!'; }
  };
  document.getElementById('rs').onclick=arm; arm();
};

F.whack = function(){
  const T=D.time;
  panel.innerHTML='<div id="h" style="display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;max-width:200px;margin:0 auto"></div><div class="score" id="sc">0 · '+T+'s</div>';
  const h=document.getElementById('h');
  let score=0, time=T, act=-1;
  for(let i=0;i<9;i++){
    const b=document.createElement('button'); b.type='button';
    b.style.cssText='aspect-ratio:1;border:0;border-radius:50%;background:#243044;font-size:1.3rem;cursor:pointer';
    (function(i,b){ b.onclick=function(){ if(i===act){ score++; act=-1; b.textContent=''; sc(score+' · '+time+'s'); } }; })(i,b);
    h.appendChild(b);
  }
  const bs=[].slice.call(h.children);
  timer=setInterval(function(){
    time--; if(act>=0) bs[act].textContent='';
    act=Math.floor(Math.random()*9); bs[act].textContent='🐹';
    sc(score+' · '+time+'s');
    if(time<=0){ clearInterval(timer); bs.forEach(function(b){b.textContent='';}); sc('Final '+score+' · '+diffName); }
  }, Math.max(400, 900/D.spd));
};

F.color = function(){
  const cols=[{n:'Red',c:'#e88a8a'},{n:'Blue',c:'#5b9fd4'},{n:'Green',c:'#6bcf9a'},{n:'Yellow',c:'#e8d44d'},{n:'Purple',c:'#b48ce8'},{n:'Orange',c:'#e8a04a'}];

    let o=cols.slice().sort(function(){return Math.random()-0.5;}).slice(0,4);

F.pong = function(){
  const c=cv(320,220), ctx=c.getContext('2d');
  let px=120, ball={x:160,y:100,vx:2.2*D.spd,vy:-2.2*D.spd}, score=0, lives=D.lives;
  c.onmousemove=function(e){ const r=c.getBoundingClientRect(); px=Math.max(0,Math.min(260,(e.clientX-r.left)*320/r.width-30)); };
  function loop(){
    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<5||ball.x>315) ball.vx*=-1;
    if(ball.y<5) ball.vy*=-1;
    if(ball.y>200&&ball.x>px&&ball.x<px+60){ ball.vy=-Math.abs(ball.vy); ball.y=200; score++; }
    if(ball.y>225){ lives--; ball={x:160,y:100,vx:2.2*D.spd,vy:-2.2*D.spd}; if(lives<=0){ sc('Over · '+score); return; } }
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,320,220);
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(px,205,60,8);
    ctx.fillStyle='#6bcf9a'; ctx.beginPath(); ctx.arc(ball.x,ball.y,6,0,7); ctx.fill();
    sc(score+' · lives '+lives+' · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.breakout = function(){
  const c=cv(320,240), ctx=c.getContext('2d');
  let px=130, ball={x:160,y:200,vx:2*D.spd,vy:-2.4*D.spd}, br=[], score=0;
  for(let r=0;r<4;r++) for(let col=0;col<8;col++) br.push({x:10+col*38,y:18+r*16,w:34,h:11,a:1});
  c.onmousemove=function(e){ const r=c.getBoundingClientRect(); px=Math.max(0,Math.min(260,(e.clientX-r.left)*320/r.width-30)); };
  function loop(){
    ball.x+=ball.vx; ball.y+=ball.vy;
    if(ball.x<5||ball.x>315) ball.vx*=-1;
    if(ball.y<5) ball.vy*=-1;
    if(ball.y>220&&ball.x>px&&ball.x<px+60){ ball.vy=-Math.abs(ball.vy); ball.y=220; }
    if(ball.y>240){ sc('Over · '+score); return; }
    br.forEach(function(b){ if(b.a&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){ b.a=0; ball.vy*=-1; score+=10; } });
    if(br.every(function(b){return !b.a;})){ sc('WIN · '+score); return; }
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,320,240);
    ctx.fillStyle='#e88a8a'; br.filter(function(b){return b.a;}).forEach(function(b){ ctx.fillRect(b.x,b.y,b.w,b.h); });
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(px,228,60,8);
    ctx.fillStyle='#6bcf9a'; ctx.beginPath(); ctx.arc(ball.x,ball.y,5,0,7); ctx.fill();
    sc(score+' · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.flappy = function(){
  const c=cv(300,240), ctx=c.getContext('2d');
  let y=100, vy=0, pipes=[{x:300,gap:70}], score=0, dead=0;
  function flap(){ if(!dead) vy=-5; }
  document.getElementById('ctrls').innerHTML='<button type="button" id="fl">Flap</button>';
  document.getElementById('fl').onclick=flap; c.onclick=flap;
  window.onkeydown=function(e){ if(e.key===' '||e.key==='ArrowUp'){ flap(); e.preventDefault(); } };
  function loop(){
    if(dead){ sc('Over · '+score); return; }
    vy+=0.28*D.spd; y+=vy;
    pipes.forEach(function(p){ p.x-=2*D.spd; });
    if(pipes[0].x<-40){ pipes.shift(); pipes.push({x:300,gap:40+Math.random()*90}); score++; }
    const p=pipes[0];
    if(p.x<40&&p.x>0&&(y<p.gap||y>p.gap+65)) dead=1;
    if(y>230||y<0) dead=1;
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,240);
    ctx.fillStyle='#6bcf9a'; pipes.forEach(function(p){ ctx.fillRect(p.x,0,34,p.gap); ctx.fillRect(p.x,p.gap+65,34,240); });
    ctx.fillStyle='#e8d44d'; ctx.fillRect(28,y,14,14);
    sc(score+' · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.dodge = function(){
  const c=cv(300,240), ctx=c.getContext('2d');
  let x=140, rocks=[], score=0, dead=0;
  window.onkeydown=function(e){ if(e.key==='ArrowLeft') x=Math.max(0,x-18); if(e.key==='ArrowRight') x=Math.min(280,x+18); e.preventDefault(); };
  c.onclick=function(e){ const r=c.getBoundingClientRect(); x=Math.max(0,Math.min(280,(e.clientX-r.left)*300/r.width-10)); };
  timer=setInterval(function(){ rocks.push({x:Math.random()*280,y:-15,s:1.5*D.spd+Math.random()*D.spd}); }, Math.max(200,500/D.spd));
  function loop(){
    if(dead){ sc('Over · '+score); return; }
    score++; rocks.forEach(function(r){ r.y+=r.s; });
    rocks=rocks.filter(function(r){ if(r.y>215&&r.y<240&&Math.abs(r.x-x)<16) dead=1; return r.y<260; });
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,240);
    ctx.fillStyle='#e88a8a'; rocks.forEach(function(r){ ctx.beginPath(); ctx.arc(r.x,r.y,9,0,7); ctx.fill(); });
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(x,220,18,12);
    sc(score+' · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.aim = function(){
  const c=cv(300,220), ctx=c.getContext('2d');
  let targets=[], score=0, time=D.time;
  function spawn(){ targets.push({x:40+Math.random()*220,y:30+Math.random()*140,r:12+Math.random()*8}); }
  for(let i=0;i<3;i++) spawn();
  c.onclick=function(e){
    const r=c.getBoundingClientRect(), mx=(e.clientX-r.left)*300/r.width, my=(e.clientY-r.top)*220/r.height;
    targets=targets.filter(function(t){ const hit=Math.hypot(t.x-mx,t.y-my)<t.r; if(hit) score++; return !hit; });
  };
  timer=setInterval(function(){ time--; spawn(); if(time<=0){ clearInterval(timer); sc('Final '+score); } },1000);
  function loop(){
    if(time<=0) return;
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,220);
    ctx.fillStyle='#e88a8a'; targets.forEach(function(t){ ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fill(); });
    sc(score+' · '+time+'s · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.math = function(){

};

F.simon = function(){
  const cols=['#e88a8a','#5b9fd4','#6bcf9a','#e8d44d'];
  let seq=[], player=[], busy=0;
  panel.innerHTML='<div id="pads" style="display:grid;grid-template-columns:1fr 1fr;gap:.35rem;max-width:170px;margin:0 auto"></div><div class="score" id="sc">Press Start</div><div class="row"><button type="button" id="st">Start</button></div>';
  const pads=document.getElementById('pads');
  cols.forEach(function(c,i){
    const b=document.createElement('button'); b.type='button';
    b.style.cssText='height:64px;border:0;border-radius:10px;background:'+c+';opacity:.4;cursor:pointer';
    b.setAttribute('data-i',i); pads.appendChild(b);
  });
  const btns=[].slice.call(pads.children);
  function flash(i){ return new Promise(function(r){ btns[i].style.opacity='1'; setTimeout(function(){ btns[i].style.opacity='.4'; setTimeout(r,120); }, 300/D.spd); }); }
  function playSeq(){
    busy=1; sc('Watch'); player=[];
    let i=0;
    function next(){ if(i>=seq.length){ busy=0; sc('Your turn'); return; } flash(seq[i]).then(function(){ i++; next(); }); }
    next();
  }
  document.getElementById('st').onclick=function(){ seq=[Math.floor(Math.random()*4)]; playSeq(); };
  btns.forEach(function(b){
    b.onclick=function(){
      if(busy||!seq.length) return;
      const i=+b.getAttribute('data-i');
      player.push(i);
      flash(i).then(function(){
        if(player[player.length-1]!==seq[player.length-1]){ sc('Wrong · level '+(seq.length-1)); seq=[]; return; }
        if(player.length===seq.length){ sc('Level '+seq.length); seq.push(Math.floor(Math.random()*4)); setTimeout(playSeq,400); }
      });
    };
  });
};

F.slider = function(){
  let tiles=[1,2,3,4,5,6,7,8,0], empty=8;
  function shuffle(){
    for(let i=0;i<60;i++){
      const x=empty%3, y=Math.floor(empty/3), m=[];
      [[0,-1],[1,0],[0,1],[-1,0]].forEach(function(d){
        const nx=x+d[0], ny=y+d[1];
        if(nx>=0&&nx<3&&ny>=0&&ny<3) m.push(ny*3+nx);
      });
      const mv=m[Math.floor(Math.random()*m.length)];
      tiles[empty]=tiles[mv]; tiles[mv]=0; empty=mv;
    }
  }
  function ren(){
    panel.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem;max-width:170px;margin:0 auto" id="sl"></div><div class="score" id="sc">Order 1–8</div><div class="row"><button type="button" id="sh">Shuffle</button></div>';
    const sl=document.getElementById('sl');
    tiles.forEach(function(t,i){
      const b=document.createElement('button'); b.type='button'; b.textContent=t||'';
      b.style.cssText='aspect-ratio:1;border:0;border-radius:8px;background:'+(t?'#243044':'#0a0e14')+';color:var(--text);font-size:1.2rem;font-weight:800;cursor:pointer';
      b.onclick=function(){
        const x=empty%3, y=Math.floor(empty/3), tx=i%3, ty=Math.floor(i/3);
        if(Math.abs(x-tx)+Math.abs(y-ty)===1){ tiles[empty]=tiles[i]; tiles[i]=0; empty=i; ren();
          if(tiles.every(function(v,idx){ return idx===8?v===0:v===idx+1; })) sc('Solved!');
        }
      };
      sl.appendChild(b);
    });
    document.getElementById('sh').onclick=function(){ shuffle(); ren(); };
  }
  shuffle(); ren();
};

F.catch = function(){
  const c=cv(300,220), ctx=c.getContext('2d');
  let x=130, items=[], score=0, time=D.time;
  c.onmousemove=function(e){ const r=c.getBoundingClientRect(); x=Math.max(0,Math.min(260,(e.clientX-r.left)*300/r.width-20)); };

  function loop(){
    if(time<=0) return;
    items.forEach(function(it){ it.y+=it.s; });

    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,220);
    ctx.fillStyle='#e8d44d'; items.forEach(function(it){ ctx.fillRect(it.x,it.y,12,12); });

    sc(score+' · '+time+'s');
    raf=requestAnimationFrame(loop);

F.tap = function(){
  const c=cv(280,200), ctx=c.getContext('2d');
  let circ={x:140,y:100,r:30,life:100}, score=0, miss=0;
  function spawn(){ circ={x:40+Math.random()*200,y:40+Math.random()*120,r:20+Math.random()*15,life:100}; }
  c.onclick=function(e){
    const r=c.getBoundingClientRect(), mx=(e.clientX-r.left)*280/r.width, my=(e.clientY-r.top)*200/r.height;
    if(Math.hypot(mx-circ.x,my-circ.y)<circ.r){ score++; spawn(); } else miss++;
    if(miss>=D.lives+2){ sc('Over · '+score); circ=null; }
  };
  spawn();
  function loop(){
    if(!circ) return;
    circ.life-=D.spd*1.2;
    if(circ.life<=0){ miss++; spawn(); if(miss>=D.lives+2){ sc('Over · '+score); return; } }
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,280,200);
    ctx.globalAlpha=Math.max(0.2,circ.life/100);
    ctx.fillStyle='#5b9fd4'; ctx.beginPath(); ctx.arc(circ.x,circ.y,circ.r,0,7); ctx.fill();
    ctx.globalAlpha=1;
    sc(score+' · miss '+miss);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.balloon = function(){
  const c=cv(300,220), ctx=c.getContext('2d');
  let balls=[], score=0, time=D.time;
  const colors=['#e88a8a','#5b9fd4','#6bcf9a','#e8d44d'];
  timer=setInterval(function(){
    balls.push({x:Math.random()*280,y:220,vy:-(1+Math.random()*D.spd),r:12+Math.random()*10,c:colors[Math.floor(Math.random()*4)]});
    time--; if(time<=0){ clearInterval(timer); sc('Final '+score); }
  },600);
  c.onclick=function(e){
    const r=c.getBoundingClientRect(), mx=(e.clientX-r.left)*300/r.width, my=(e.clientY-r.top)*220/r.height;
    balls=balls.filter(function(b){ if(Math.hypot(b.x-mx,b.y-my)<b.r){ score++; return false; } return true; });
  };
  function loop(){
    if(time<=0) return;
    balls.forEach(function(b){ b.y+=b.vy; });
    balls=balls.filter(function(b){ return b.y>-20; });
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,220);
    balls.forEach(function(b){ ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); });
    sc(score+' · '+time+'s');
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.stack = function(){
  const c=cv(280,240), ctx=c.getContext('2d');
  let blocks=[{x:90,y:220,w:100}], cur={x:0,y:180,w:100,dir:1}, score=0, spd=2*D.spd;
  function loop(){
    cur.x+=cur.dir*spd;
    if(cur.x<0||cur.x+cur.w>280) cur.dir*=-1;
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,280,240);
    ctx.fillStyle='#5b9fd4'; blocks.forEach(function(b){ ctx.fillRect(b.x,b.y,b.w,18); });
    ctx.fillStyle='#6bcf9a'; ctx.fillRect(cur.x,cur.y,cur.w,18);
    sc(score+' · click to drop');
    raf=requestAnimationFrame(loop);
  }
  loop();
  c.onclick=function(){
    const prev=blocks[blocks.length-1];
    const left=Math.max(cur.x,prev.x), right=Math.min(cur.x+cur.w,prev.x+prev.w);
    if(right-left<15){ sc('Miss · '+score); return; }
    cur.w=right-left; cur.x=left;
    blocks.push({x:cur.x,y:cur.y,w:cur.w});
    score++;
    cur={x:0,y:cur.y-20,w:cur.w,dir:1};
    spd=2*D.spd+score*0.15;
    if(cur.y<20) sc('Tower win · '+score);
  };
};

F.bounce = function(){
  const c=cv(280,220), ctx=c.getContext('2d');
  let y=180, vy=0, score=0, dead=0;
  c.onclick=function(){ if(!dead) vy=-7; };
  function loop(){
    if(dead){ sc('Over · '+score); return; }
    vy+=0.35; y+=vy;
    if(y>200){ y=200; vy=0; dead=1; }
    if(y<200&&vy>0) score++;
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,280,220);
    ctx.fillStyle='#6bcf9a'; ctx.beginPath(); ctx.arc(140,y,12,0,7); ctx.fill();
    sc(score+' · tap to bounce');
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.runner = function(){
  const c=cv(320,160), ctx=c.getContext('2d');
  let y=120, vy=0, on=1, obs=[], score=0, dead=0;
  window.onkeydown=function(e){ if((e.key===' '||e.key==='ArrowUp')&&on){ vy=-8; on=0; e.preventDefault(); } };
  c.onclick=function(){ if(on){ vy=-8; on=0; } };
  timer=setInterval(function(){ obs.push({x:320,w:20+Math.random()*20}); }, Math.max(600,1200/D.spd));
  function loop(){
    if(dead){ sc('Over · '+score); return; }
    vy+=0.5; y+=vy; if(y>=120){ y=120; vy=0; on=1; }
    obs.forEach(function(o){ o.x-=4*D.spd; });
    obs=obs.filter(function(o){ if(o.x<50&&o.x>20&&y>100) dead=1; if(o.x<-30){ score++; return false; } return true; });
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,320,160);
    ctx.fillStyle='#2a3548'; ctx.fillRect(0,140,320,20);
    ctx.fillStyle='#e88a8a'; obs.forEach(function(o){ ctx.fillRect(o.x,120,o.w,20); });
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(30,y,16,20);
    sc(score+' · '+diffName);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.shoot = function(){
  const c=cv(300,240), ctx=c.getContext('2d');
  let ship=140, bullets=[], asts=[], score=0;
  window.onkeydown=function(e){
    if(e.key==='ArrowLeft') ship=Math.max(10,ship-15);
    if(e.key==='ArrowRight') ship=Math.min(280,ship+15);
    if(e.key===' ') bullets.push({x:ship+8,y:210});
  };
  c.onclick=function(){ bullets.push({x:ship+8,y:210}); };
  timer=setInterval(function(){ asts.push({x:Math.random()*280,y:-20,r:10+Math.random()*12,s:1+D.spd}); }, Math.max(400,800/D.spd));
  function loop(){
    bullets.forEach(function(b){ b.y-=6; });
    asts.forEach(function(a){ a.y+=a.s; });
    bullets=bullets.filter(function(b){ return b.y>0; });
    asts=asts.filter(function(a){
      let hit=0;
      bullets=bullets.filter(function(b){ if(Math.hypot(b.x-a.x,b.y-a.y)<a.r){ hit=1; score++; return false; } return true; });
      return !hit && a.y<250;
    });
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,240);
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(ship,220,20,12);
    ctx.fillStyle='#e8d44d'; bullets.forEach(function(b){ ctx.fillRect(b.x,b.y,3,8); });
    ctx.fillStyle='#e88a8a'; asts.forEach(function(a){ ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); });
    sc(score+' · space/click shoot');
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.match3 = function(){
  const icons=['🍎','⭐','🌙','🔥','💎','🎵'];
  let a=icons[Math.floor(Math.random()*icons.length)], b=icons[Math.floor(Math.random()*icons.length)], score=0, left=D.time;
  function show(){
    panel.innerHTML='<div class="msg" style="font-size:2rem">'+a+' '+b+'</div><div class="row"><button type="button" id="yes">Match</button><button type="button" id="no">Different</button></div><div class="score" id="sc">'+score+' · '+left+'s</div>';
    document.getElementById('yes').onclick=function(){ if(a===b) score++; else score=Math.max(0,score-1); a=icons[Math.floor(Math.random()*icons.length)]; b=Math.random()<0.45?a:icons[Math.floor(Math.random()*icons.length)]; show(); };
    document.getElementById('no').onclick=function(){ if(a!==b) score++; else score=Math.max(0,score-1); a=icons[Math.floor(Math.random()*icons.length)]; b=Math.random()<0.45?a:icons[Math.floor(Math.random()*icons.length)]; show(); };
  }
  show();
  timer=setInterval(function(){ left--; sc(score+' · '+left+'s'); if(left<=0){ clearInterval(timer); panel.innerHTML='<div class="msg">Score '+score+'</div>'; } },1000);
};

F.timer = function(){
  const target=2+Math.random()*3;
  panel.innerHTML='<div class="msg">Stop near '+target.toFixed(1)+'s</div><div class="row"><button type="button" id="go">Start</button><button type="button" id="st" disabled>Stop</button></div><div class="msg" id="m"></div>';
  let t0;
  document.getElementById('go').onclick=function(){ t0=performance.now(); document.getElementById('st').disabled=0; document.getElementById('m').textContent='Running...'; };
  document.getElementById('st').onclick=function(){
    const t=(performance.now()-t0)/1000, off=Math.abs(t-target);
    document.getElementById('m').textContent=t.toFixed(2)+'s · off by '+off.toFixed(2)+' · '+(off<0.2?'Perfect!':off<0.5?'Good':'Try again');
    document.getElementById('st').disabled=1;
  };
};

F.lights = function(){
  const N=3;
  let grid=[];
  for(let y=0;y<N;y++){ grid[y]=[]; for(let x=0;x<N;x++) grid[y][x]=Math.random()>0.5?1:0; }
  function ren(){
    panel.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:160px;margin:0 auto" id="lg"></div><div class="score" id="sc">Turn all off</div>';
    const lg=document.getElementById('lg');
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const b=document.createElement('button'); b.type='button';
      b.style.cssText='aspect-ratio:1;border:0;border-radius:6px;background:'+(grid[y][x]?'#e8d44d':'#243044')+';cursor:pointer';
      (function(x,y){
        b.onclick=function(){
          [[0,0],[0,1],[0,-1],[1,0],[-1,0]].forEach(function(d){
            const nx=x+d[0], ny=y+d[1];
            if(nx>=0&&nx<N&&ny>=0&&ny<N) grid[ny][nx]^=1;
          });
          ren();
          if(grid.every(function(r){return r.every(function(c){return !c;});})) sc('All off! WIN');
        };
      })(x,y);
      lg.appendChild(b);
    }
  }
  ren();
};

F.collect = function(){
  const c=cv(300,220), ctx=c.getContext('2d');
  let x=150, y=110, stars=[], score=0, time=D.time;
  window.onkeydown=function(e){
    if(e.key==='ArrowLeft') x-=12; if(e.key==='ArrowRight') x+=12;
    if(e.key==='ArrowUp') y-=12; if(e.key==='ArrowDown') y+=12;
    x=Math.max(10,Math.min(290,x)); y=Math.max(10,Math.min(210,y));
  };
  function spawn(){ stars.push({x:20+Math.random()*260,y:20+Math.random()*180}); }
  for(let i=0;i<5;i++) spawn();
  timer=setInterval(function(){ time--; if(time<=0){ clearInterval(timer); sc('Final '+score); } },1000);
  function loop(){
    if(time<=0) return;
    stars=stars.filter(function(s){ if(Math.hypot(s.x-x,s.y-y)<16){ score++; spawn(); return false; } return true; });
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,220);
    ctx.fillStyle='#e8d44d'; stars.forEach(function(s){ ctx.beginPath(); ctx.arc(s.x,s.y,7,0,7); ctx.fill(); });
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(x-8,y-8,16,16);
    sc(score+' · '+time+'s');
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.portal = function(){
  const c=cv(300,220), ctx=c.getContext('2d');
  let x=30, y=110, portal={x:260,y:100}, won=0;
  window.onkeydown=function(e){
    if(e.key==='ArrowLeft') x-=10; if(e.key==='ArrowRight') x+=10;
    if(e.key==='ArrowUp') y-=10; if(e.key==='ArrowDown') y+=10;
    x=Math.max(5,Math.min(285,x)); y=Math.max(5,Math.min(205,y));
    if(Math.hypot(x-portal.x,y-portal.y)<20) won=1;
  };
  function loop(){
    if(won){ sc('Portal reached!'); return; }
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,220);
    ctx.fillStyle='#b48ce8'; ctx.beginPath(); ctx.arc(portal.x,portal.y,16,0,7); ctx.fill();
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(x,y,14,14);
    sc('Arrows to purple portal');
    raf=requestAnimationFrame(loop);
  }
  loop();
};

F.boss = function(){
  const c=cv(300,240), ctx=c.getContext('2d');
  let x=140, hp=3*D.lives, enemies=[], score=0, wave=1;
  window.onkeydown=function(e){
    if(e.key==='ArrowLeft') x=Math.max(10,x-20);
    if(e.key==='ArrowRight') x=Math.min(270,x+20);
    if(e.key===' ') enemies.push({x:x+10,y:200,vy:-5,friendly:1});
  };
  function spawn(){ for(let i=0;i<wave;i++) enemies.push({x:Math.random()*280,y:-20,vy:1+D.spd*0.5,friendly:0}); }
  spawn();
  timer=setInterval(spawn, Math.max(1500,3000/D.spd));
  function loop(){
    if(hp<=0){ sc('Defeated · '+score); return; }
    enemies.forEach(function(e){ e.y+=e.vy; });
    enemies=enemies.filter(function(e){
      if(!e.friendly&&e.y>210&&Math.abs(e.x-x)<25){ hp--; return false; }
      if(e.friendly){
        for(let i=0;i<enemies.length;i++){
          const o=enemies[i];
          if(!o.friendly&&Math.hypot(o.x-e.x,o.y-e.y)<15){ score+=10; enemies.splice(i,1); return false; }
        }
        return e.y>0;
      }
      return e.y<250;
    });
    if(score>wave*50) wave++;
    ctx.fillStyle='#0a0e14'; ctx.fillRect(0,0,300,240);
    ctx.fillStyle='#5b9fd4'; ctx.fillRect(x,215,24,12);
    ctx.fillStyle='#e88a8a'; enemies.filter(function(e){return !e.friendly;}).forEach(function(e){ ctx.fillRect(e.x,e.y,14,14); });
    ctx.fillStyle='#e8d44d'; enemies.filter(function(e){return e.friendly;}).forEach(function(e){ ctx.fillRect(e.x,e.y,4,8); });
    sc('HP '+hp+' · '+score+' · wave '+wave);
    raf=requestAnimationFrame(loop);
  }
  loop();
};

})();
</script>
